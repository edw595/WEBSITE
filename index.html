  function prepareDetectImage(img) {
    const maxSide = 640;
    const scale = Math.min(1, maxSide / img.width, maxSide / img.height);
    if (scale >= 0.999) return { el: img, scale: 1 };
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(img.width * scale));
    c.height = Math.max(1, Math.round(img.height * scale));
    const ctx = c.getContext("2d");
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(img, 0, 0, c.width, c.height);
    return { el: c, scale };
  }

  function mapDetectBox(box, scale) {
    const s = scale || 1;
    return {
      x: box.x / s,
      y: box.y / s,
      w: box.w / s,
      h: box.h / s,
      score: box.score || 0
    };
  }

  async function detectFacesNative(el) {
    if (typeof FaceDetector !== "function") return [];
    const fd = new FaceDetector({ fastMode: false, maxDetectedFaces: 4 });
    const hits = await fd.detect(el);
    return (hits || []).map((h) => ({
      x: h.boundingBox.x,
      y: h.boundingBox.y,
      w: h.boundingBox.width,
      h: h.boundingBox.height,
      score: 1
    })).filter((f) => f.w > 4 && f.h > 4);
  }

  async function getMediaPipeFaceDetector() {
    if (mediaPipeFaceDetector) return mediaPipeFaceDetector;
    if (mediaPipeFaceDetectorLoading) return mediaPipeFaceDetectorLoading;
    const cdn = "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";
    mediaPipeFaceDetectorLoading = (async () => {
      const { FaceDetector, FilesetResolver } = await import(cdn);
      const vision = await FilesetResolver.forVisionTasks(`${cdn}/wasm`);
      mediaPipeFaceDetector = await FaceDetector.createFromOptions(vision, {
        baseOptions: {
          modelAssetPath: "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite"
        },
        runningMode: "IMAGE",
        minDetectionConfidence: 0.45
      });
      return mediaPipeFaceDetector;
    })();
    try {
      return await mediaPipeFaceDetectorLoading;
    } catch (err) {
      mediaPipeFaceDetectorLoading = null;
      throw err;
    }
  }

  async function detectFacesMediaPipe(el) {
    const det = await getMediaPipeFaceDetector();
    const result = det.detect(el);
    return (result.detections || []).map((d) => {
      const bb = d.boundingBox || {};
      return {
        x: bb.originX || 0,
        y: bb.originY || 0,
        w: bb.width || 0,
        h: bb.height || 0,
        score: d.categories?.[0]?.score || 0
      };
    }).filter((f) => f.w > 4 && f.h > 4);
  }

  async function scheduleFaceDetect() {
    if (!currentImage) {
      detectedFaces = [];
      setFaceCropEnabled(false);
      updateOrigDimensionsLabel();
      return;
    }
    const gen = ++faceDetectGen;
    detectedFaces = [];
    setFaceCropEnabled(false);
    updateOrigDimensionsLabel("辨識臉部中");
    if (uploadTool === "none") drawDetectedFaces();
    if (faceDetectBusy) {
      // latest gen still wins when the in-flight run finishes
    }
    faceDetectBusy = true;
    try {
      const { el, scale } = prepareDetectImage(currentImage);
      let boxes = [];
      try {
        boxes = await detectFacesNative(el);
      } catch (_) {}
      if (gen !== faceDetectGen) return;
      if (!boxes.length) {
        try {
          boxes = await detectFacesMediaPipe(el);
        } catch (_) {}
      }
      if (gen !== faceDetectGen) return;
      detectedFaces = boxes.map((b) => mapDetectBox(b, scale));
    } catch (_) {
      if (gen !== faceDetectGen) return;
      detectedFaces = [];
    } finally {
      if (gen === faceDetectGen) faceDetectBusy = false;
    }
    if (gen !== faceDetectGen) return;
    setFaceCropEnabled(detectedFaces.length > 0);
    updateOrigDimensionsLabel();
    drawDetectedFaces();
  }

  function layoutImageToolboxFan() {
    const menu = document.getElementById("imageToolboxMenu");
    const toolbox = document.getElementById("imageToolbox");
    if (!menu) return;
    const buttons = [...menu.querySelectorAll(":scope > .zoom-btn")].filter((btn) => btn.style.display !== "none");
    const n = buttons.length;
    if (!n) return;

    const minGap = 16;
    const sizes = buttons.map((btn) => ({
      w: Math.max(btn.offsetWidth, 72),
      h: Math.max(btn.offsetHeight, 34)
    }));
    const angles = buttons.map((_, i) => {
      const t = n <= 1 ? 0.5 : i / (n - 1);
      return t * Math.PI / 2;
    });

    function boxesAt(r) {
      return sizes.map((size, i) => {
        const θ = angles[i];
        const cx = -Math.cos(θ) * r;
        const cy = -Math.sin(θ) * r;
        const left = cx - size.w * (1 + Math.cos(θ)) / 2;
        const top = cy - size.h * (1 + Math.sin(θ)) / 2;
        return { left, top, right: left + size.w, bottom: top + size.h };
      });
    }

    function overlaps(boxes) {
      for (let i = 0; i < boxes.length; i++) {
        for (let j = i + 1; j < boxes.length; j++) {
          const a = boxes[i], b = boxes[j];
          if (a.left < b.right + minGap && a.right + minGap > b.left &&
              a.top < b.bottom + minGap && a.bottom + minGap > b.top) return true;
        }
      }
      return false;
    }

    let radius = 64;
    while (radius < 480 && overlaps(boxesAt(radius))) radius += 6;

    let maxReach = radius;
    buttons.forEach((btn, i) => {
      const θ = angles[i];
      const x = -Math.cos(θ) * radius;
      const y = -Math.sin(θ) * radius;
      btn.style.setProperty("--fan-x", `${x.toFixed(1)}px`);
      btn.style.setProperty("--fan-y", `${y.toFixed(1)}px`);
      btn.style.setProperty("--fan-ox", `${(-50 * (1 + Math.cos(θ))).toFixed(2)}%`);
      btn.style.setProperty("--fan-oy", `${(-50 * (1 + Math.sin(θ))).toFixed(2)}%`);
      const box = boxesAt(radius)[i];
      maxReach = Math.max(maxReach, Math.abs(box.left), Math.abs(box.top), Math.abs(box.right), Math.abs(box.bottom));
    });
    if (toolbox) toolbox.style.setProperty("--fan-reach", `${Math.ceil(maxReach + 24)}px`);
  }

  function resetOrigImage() {
    if (!rawSourceImage) return;
    currentImage = new Image();
    currentImage.onload = () => {
      const origImgEl = document.getElementById("originalImg");
      origImgEl.src = currentImage.src;
      origImgEl.style.width = currentImage.width + "px";
      origImgEl.style.height = currentImage.height + "px";

      cropOverlay.width = currentImage.width;
      cropOverlay.height = currentImage.height;
      cropOverlay.style.width = currentImage.width + "px";
      cropOverlay.style.height = currentImage.height + "px";

      updateOrigDimensionsLabel();

      setUploadTool('none');
      processImageCore(true, "還原原圖");
      pushUploadHistoryState();
      scheduleFaceDetect();
      setTimeout(() => { fitOrigToWindow(); }, 30);
    };
    currentImage.src = rawSourceImage.src;
  }

  function getCropPreciseCoords(e) {
    const rect = cropOverlay.getBoundingClientRect();
    let clientX = e.clientX, clientY = e.clientY;
    if (e.touches && e.touches.length > 0) {
      clientX = e.touches[0].clientX;
      clientY = e.touches[0].clientY;
    }
    
    const scaleX = cropOverlay.width / rect.width;
    const scaleY = cropOverlay.height / rect.height;

    const x = Math.round((clientX - rect.left) * scaleX);
    const y = Math.round((clientY - rect.top) * scaleY);

    return {
      x: Math.max(0, Math.min(cropOverlay.width, x)),
      y: Math.max(0, Math.min(cropOverlay.height, y))
    };
  }

  function getNormalizedRect() {
    if (!rectStart || !rectCurrent) return null;
    const x = Math.min(rectStart.x, rectCurrent.x);
    const y = Math.min(rectStart.y, rectCurrent.y);
    const w = Math.abs(rectStart.x - rectCurrent.x);
    const h = Math.abs(rectStart.y - rectCurrent.y);
    return { x, y, w, h };
  }

  function pointInRect(px, py, r) {
    return r && px >= r.x && px <= r.x + r.w && py >= r.y && py <= r.y + r.h;
  }

  function updateCropConfirmBar() {
    const bar = document.getElementById("polyConfirmBar");
    if (!bar) return;
    const r = getNormalizedRect();
    const showRect = uploadTool === "rect" && r && r.w >= 5 && r.h >= 5;
    bar.classList.toggle("has-crop-actions", uploadTool === "poly" || showRect);
  }

  function cancelCropAction() {
    if (uploadTool === "rect") {
      rectStart = null;
      rectCurrent = null;
      isDrawingRect = false;
      isMovingRect = false;
      ctxCrop.clearRect(0, 0, cropOverlay.width, cropOverlay.height);
      cropOverlay.style.cursor = "crosshair";
      updateCropConfirmBar();
      return;
    }
    setUploadTool("none");
  }

  function applyRectDrag(x, y) {
    const r = getNormalizedRect();
    if (!r) return;
    let nx = x - rectMoveOffset.x;
    let ny = y - rectMoveOffset.y;
    nx = Math.max(0, Math.min(cropOverlay.width - r.w, nx));
    ny = Math.max(0, Math.min(cropOverlay.height - r.h, ny));
    rectStart = { x: nx, y: ny };
    rectCurrent = { x: nx + r.w, y: ny + r.h };
    drawRectSelection();
  }

  cropOverlay.addEventListener("mousedown", (e) => {
    if (!currentImage) return;
    const { x, y } = getCropPreciseCoords(e);
    const strokeScale = 1 / (origZoom || 1);
    const clickTolerance = Math.max(8, 10 * strokeScale);

    if (uploadTool === 'rect') {
      const r = getNormalizedRect();
      if (r && r.w >= 5 && r.h >= 5 && pointInRect(x, y, r)) {
        isMovingRect = true;
        isDrawingRect = false;
        rectStart = { x: r.x, y: r.y };
        rectCurrent = { x: r.x + r.w, y: r.y + r.h };
        rectMoveOffset = { x: x - r.x, y: y - r.y };
      } else {
        isDrawingRect = true;
        isMovingRect = false;
        rectStart = { x, y };
        rectCurrent = { x, y };
        drawRectSelection();
        updateCropConfirmBar();
      }
    } else if (uploadTool === 'poly') {
      if (polyPoints.length > 0) {
        if (polyPoints.length >= 3) {
          const startP = polyPoints[0];
          if (Math.hypot(x - startP.x, y - startP.y) <= clickTolerance) {
            polyPolygons.push([...polyPoints]);
            polyPoints = [];
            startMarchingAnts();
            return;
          }
        }

        for (let i = polyPoints.length - 1; i >= 0; i--) {
          const pt = polyPoints[i];
          if (Math.hypot(x - pt.x, y - pt.y) <= clickTolerance) {
            polyPoints.splice(i, 1);
            drawPolySelection();
            return;
          }
        }
      }

      polyPoints.push({ x, y });
      drawPolySelection();
    } else if (uploadTool === 'wand') {
      magicWandRemove(x, y);
    }
  });

  cropOverlay.addEventListener("mousemove", (e) => {
    if (uploadTool !== "rect") return;
    const { x, y } = getCropPreciseCoords(e);
    if (isMovingRect) {
      applyRectDrag(x, y);
    } else if (isDrawingRect && rectStart) {
      rectCurrent = { x, y };
      drawRectSelection();
    } else {
      const r = getNormalizedRect();
      cropOverlay.style.cursor = (r && r.w >= 5 && r.h >= 5 && pointInRect(x, y, r)) ? "move" : "crosshair";
    }
  });

  window.addEventListener("mousemove", (e) => {
    if (uploadTool !== "rect") return;
    if (!isDrawingRect && !isMovingRect) return;
    const { x, y } = getCropPreciseCoords(e);
    if (isMovingRect) applyRectDrag(x, y);
    else if (isDrawingRect && rectStart) {
      rectCurrent = { x, y };
      drawRectSelection();
    }
  });

  window.addEventListener("mouseup", () => {
    if (uploadTool !== "rect") return;
    if (isDrawingRect && rectStart && rectCurrent) {
      const r = getNormalizedRect();
      if (!r || r.w < 5 || r.h < 5) {
        rectStart = null;
        rectCurrent = null;
        ctxCrop.clearRect(0, 0, cropOverlay.width, cropOverlay.height);
      } else {
        rectStart = { x: r.x, y: r.y };
        rectCurrent = { x: r.x + r.w, y: r.y + r.h };
        drawRectSelection();
      }
    }
    isDrawingRect = false;
    isMovingRect = false;
    updateCropConfirmBar();
  });

  function drawRectSelection() {
    ctxCrop.clearRect(0, 0, cropOverlay.width, cropOverlay.height);
    if (!rectStart || !rectCurrent) return;
    
    const x = Math.min(rectStart.x, rectCurrent.x);
    const y = Math.min(rectStart.y, rectCurrent.y);
    const w = Math.abs(rectStart.x - rectCurrent.x);
    const h = Math.abs(rectStart.y - rectCurrent.y);

    const viewScale = 1 / (origZoom || 1);

    ctxCrop.fillStyle = "rgba(0, 0, 0, 0.55)";
    ctxCrop.fillRect(0, 0, cropOverlay.width, cropOverlay.height);
    ctxCrop.clearRect(x, y, w, h);

    ctxCrop.save();
    ctxCrop.strokeStyle = "#ff3344";
    ctxCrop.lineWidth = Math.max(1.8, 3 * viewScale);
    ctxCrop.setLineDash([Math.round(6 * viewScale), Math.round(6 * viewScale)]);
    ctxCrop.strokeRect(x, y, w, h);
    ctxCrop.restore();
  }

  function drawPolySelection() {
    ctxCrop.clearRect(0, 0, cropOverlay.width, cropOverlay.height);

    const viewScale = 1 / (origZoom || 1);
    const lineWidthVal = Math.max(1.8, 3 * viewScale);
    const dashVal = [Math.round(6 * viewScale), Math.round(6 * viewScale)];
    const nodeRadius = Math.max(3.5, 5 * viewScale);

    if (polyPolygons.length > 0) {
      const W = cropOverlay.width;
      const H = cropOverlay.height;

      if (offscreenMask.width !== W || offscreenMask.height !== H) {
        offscreenMask.width = W; offscreenMask.height = H;
        offscreenStroke.width = W; offscreenStroke.height = H;
        offscreenAnts.width = W; offscreenAnts.height = H;
      }

      mCtx.clearRect(0, 0, W, H);
      sCtx.clearRect(0, 0, W, H);
      aCtx.clearRect(0, 0, W, H);

      mCtx.globalCompositeOperation = "source-over";
      mCtx.fillStyle = "#ff3344";
      polyPolygons.forEach(polygon => {
        if (polygon.length < 3) return;
        mCtx.beginPath();
        mCtx.moveTo(polygon[0].x, polygon[0].y);
        for (let i = 1; i < polygon.length; i++) mCtx.lineTo(polygon[i].x, polygon[i].y);
        mCtx.closePath();
        mCtx.fill("nonzero");
      });

      sCtx.globalCompositeOperation = "source-over";
      sCtx.fillStyle = "#ff3344";
      sCtx.strokeStyle = "#ff3344";
      sCtx.lineWidth = lineWidthVal * 2;
      sCtx.lineJoin = "round";

      polyPolygons.forEach(polygon => {
        if (polygon.length < 3) return;
        sCtx.beginPath();
        sCtx.moveTo(polygon[0].x, polygon[0].y);
        for (let i = 1; i < polygon.length; i++) sCtx.lineTo(polygon[i].x, polygon[i].y);
        sCtx.closePath();
        sCtx.fill("nonzero");
        sCtx.stroke();
      });

      sCtx.globalCompositeOperation = "destination-out";
      sCtx.drawImage(offscreenMask, 0, 0);
      sCtx.globalCompositeOperation = "source-over";

      aCtx.globalCompositeOperation = "source-over";
      aCtx.strokeStyle = "#ff3344";
      aCtx.lineWidth = lineWidthVal;
      aCtx.setLineDash(dashVal);
      aCtx.lineDashOffset = -marchingAntsOffset * viewScale;

      polyPolygons.forEach(polygon => {
        if (polygon.length < 3) return;
        aCtx.beginPath();
        aCtx.moveTo(polygon[0].x, polygon[0].y);
        for (let i = 1; i < polygon.length; i++) aCtx.lineTo(polygon[i].x, polygon[i].y);
        aCtx.closePath();
        aCtx.stroke();
      });

      aCtx.globalCompositeOperation = "destination-in";
      aCtx.drawImage(offscreenStroke, 0, 0);
      aCtx.globalCompositeOperation = "source-over";

      ctxCrop.save();
      ctxCrop.globalCompositeOperation = "source-over";
      ctxCrop.globalAlpha = 0.28;
      ctxCrop.drawImage(offscreenMask, 0, 0);
      ctxCrop.restore();

      ctxCrop.save();
      ctxCrop.globalCompositeOperation = "source-over";
      ctxCrop.globalAlpha = 1.0;
      ctxCrop.drawImage(offscreenAnts, 0, 0);
      ctxCrop.restore();
    }

    if (polyPoints.length > 0) {
      ctxCrop.save();
      ctxCrop.globalCompositeOperation = "source-over";
      ctxCrop.globalAlpha = 1.0;
      ctxCrop.beginPath();
      ctxCrop.moveTo(polyPoints[0].x, polyPoints[0].y);
      for (let i = 1; i < polyPoints.length; i++) ctxCrop.lineTo(polyPoints[i].x, polyPoints[i].y);
      ctxCrop.strokeStyle = "#ff3344";
      ctxCrop.lineWidth = lineWidthVal;
      ctxCrop.setLineDash(dashVal);
      ctxCrop.stroke();

      polyPoints.forEach((p, idx) => {
        const isStartNode = (idx === 0);
        const canClose = (isStartNode && polyPoints.length >= 3);
        const r = canClose ? nodeRadius * 1.35 : nodeRadius;

        ctxCrop.beginPath();
        ctxCrop.arc(p.x, p.y, r, 0, Math.PI * 2);
        ctxCrop.fillStyle = canClose ? "#00ff88" : "#ffe600";
        ctxCrop.fill();

        ctxCrop.lineWidth = Math.max(1, 1.5 * viewScale);
        ctxCrop.strokeStyle = "#181825";
        ctxCrop.stroke();

        ctxCrop.beginPath();
        ctxCrop.arc(p.x, p.y, r + Math.max(1, 1.2 * viewScale), 0, Math.PI * 2);
        ctxCrop.lineWidth = Math.max(0.8, 1 * viewScale);
        ctxCrop.strokeStyle = "#ffffff";
        ctxCrop.stroke();
      });
      ctxCrop.restore();
    }
  }

  function goToEditWithCurrentImage() {
    applySuggestedBeadWidth();
    processImageCore(true, "確認上傳");
    switchStageView("edit");
    requestAnimationFrame(() => {
      fitCanvasToWindow();
      centerPatternInView();
    });
  }

  function confirmUpload() {
    if (!currentImage) return;
    const applied = applyCurrentSelection(goToEditWithCurrentImage);
    if (!applied) goToEditWithCurrentImage();
  }

  function applyCurrentSelection(onDone) {
    if (!currentImage) return false;

    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

    if (uploadTool === 'rect' && rectStart && rectCurrent) {
      minX = Math.min(rectStart.x, rectCurrent.x);
      minY = Math.min(rectStart.y, rectCurrent.y);
      maxX = Math.max(rectStart.x, rectCurrent.x);
      maxY = Math.max(rectStart.y, rectCurrent.y);
    } else if (uploadTool === 'poly') {
      if (polyPoints.length >= 3) {
        polyPolygons.push([...polyPoints]);
        polyPoints = [];
      }
      if (polyPolygons.length === 0) return false;

      polyPolygons.forEach(polygon => {
        polygon.forEach(p => {
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
        });
      });
    } else return false;

    minX = Math.max(0, Math.floor(minX));
    minY = Math.max(0, Math.floor(minY));
    maxX = Math.min(currentImage.naturalWidth || currentImage.width, Math.ceil(maxX));
    maxY = Math.min(currentImage.naturalHeight || currentImage.height, Math.ceil(maxY));

    const cropW = maxX - minX;
    const cropH = maxY - minY;
    if (cropW < 5 || cropH < 5) return false;

    const cvs = document.createElement("canvas");
    cvs.width = cropW;
    cvs.height = cropH;
    const ctx = cvs.getContext("2d");

    if (uploadTool === 'rect') {
      ctx.drawImage(currentImage, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
    } else if (uploadTool === 'poly') {
      const mask = document.createElement("canvas");
      mask.width = cropW;
      mask.height = cropH;
      const maskCtx = mask.getContext("2d");
      maskCtx.fillStyle = "#ffffff";
      polyPolygons.forEach(polygon => {
        if (polygon.length < 3) return;
        maskCtx.beginPath();
        maskCtx.moveTo(polygon[0].x - minX, polygon[0].y - minY);
        for (let i = 1; i < polygon.length; i++) {
          maskCtx.lineTo(polygon[i].x - minX, polygon[i].y - minY);
        }
        maskCtx.closePath();
        maskCtx.fill("nonzero");
      });
      ctx.drawImage(currentImage, minX, minY, cropW, cropH, 0, 0, cropW, cropH);
      ctx.globalCompositeOperation = "destination-in";
      ctx.drawImage(mask, 0, 0);
      ctx.globalCompositeOperation = "source-over";
      stopMarchingAnts();
    }

    updateCurrentImageFromCanvas(cvs, onDone);
    return true;
  }

  function magicWandRemove(startX, startY, tolerance = 28) {
    const cvs = document.createElement("canvas");
    cvs.width = currentImage.width; cvs.height = currentImage.height;
    const ctx = cvs.getContext("2d");
    ctx.drawImage(currentImage, 0, 0);
    const imgData = ctx.getImageData(0, 0, cvs.width, cvs.height);
    const data = imgData.data;
    const w = cvs.width, h = cvs.height;

    const startIdx = (startY * w + startX) * 4;
    const targetR = data[startIdx], targetG = data[startIdx + 1], targetB = data[startIdx + 2], targetA = data[startIdx + 3];
    if (targetA === 0) return;

    const visited = new Uint8Array(w * h);
    const queue = [[startX, startY]];
    visited[startY * w + startX] = 1;

    while (queue.length > 0) {
      const [x, y] = queue.pop();
      const idx = (y * w + x) * 4;
      data[idx + 3] = 0;

      const neighbors = [[x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]];
      for (const [nx, ny] of neighbors) {
        if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
          const nPos = ny * w + nx;
          if (!visited[nPos]) {
            visited[nPos] = 1;
            const nIdx = nPos * 4;
            const diff = Math.abs(data[nIdx] - targetR) + Math.abs(data[nIdx + 1] - targetG) + Math.abs(data[nIdx + 2] - targetB);
            if (diff <= tolerance * 3 && data[nIdx + 3] > 0) {
              queue.push([nx, ny]);
            }
          }
        }
      }
    }
    ctx.putImageData(imgData, 0, 0);
    updateCurrentImageFromCanvas(cvs);
  }

  function autoAiRemoveBg() {
    if (!currentImage) return;

    const cvs = document.createElement("canvas");
    const w = currentImage.width;
    const h = currentImage.height;
    cvs.width = w;
    cvs.height = h;

    const ctx = cvs.getContext("2d");
    ctx.drawImage(currentImage, 0, 0);
    const imgData = ctx.getImageData(0, 0, w, h);
    const data = imgData.data;

    const bgSamples = [];
    const stepX = Math.max(1, Math.floor(w / 15));
    const stepY = Math.max(1, Math.floor(h / 15));

    for (let x = 0; x < w; x += stepX) {
      bgSamples.push(getPixelLab(data, x, 0, w));
      bgSamples.push(getPixelLab(data, x, h - 1, w));
    }
    for (let y = 0; y < h; y += stepY) {
      bgSamples.push(getPixelLab(data, 0, y, w));
      bgSamples.push(getPixelLab(data, w - 1, y, w));
    }

    const visited = new Uint8Array(w * h);
    const queue = [];

    for (let x = 0; x < w; x++) {
      checkAndEnqueue(x, 0);
      checkAndEnqueue(x, h - 1);
    }
    for (let y = 0; y < h; y++) {
      checkAndEnqueue(0, y);
      checkAndEnqueue(w - 1, y);
    }

    function getPixelLab(d, px, py, width) {
      const idx = (py * width + px) * 4;
      return rgbToLab(d[idx], d[idx + 1], d[idx + 2]);
    }

    function checkAndEnqueue(px, py) {
      const pos = py * w + px;
      if (visited[pos]) return;

      const pLab = getPixelLab(data, px, py, w);
      let minDiff = Infinity;
      for (let i = 0; i < bgSamples.length; i++) {
        const sLab = bgSamples[i];
        const diff = Math.hypot(pLab.L - sLab.L, pLab.a - sLab.a, pLab.b - sLab.b);
        if (diff < minDiff) minDiff = diff;
      }

      if (minDiff < 22) {
        visited[pos] = 1;
        queue.push(px, py);
      }
    }

    let head = 0;
    while (head < queue.length) {
      const qx = queue[head++];
      const qy = queue[head++];
      const idx = (qy * w + qx) * 4;

      data[idx + 3] = 0;

      const neighbors = [[qx + 1, qy], [qx - 1, qy], [qx, qy + 1], [qx, qy - 1]];
      for (let i = 0; i < 4; i++) {
        const nx = neighbors[i][0];
        const ny = neighbors[i][1];
        if (nx >= 0 && nx < w && ny >= 0 && ny < h) {
          const nPos = ny * w + nx;
          if (!visited[nPos]) {
            const nLab = getPixelLab(data, nx, ny, w);
            let minDiff = Infinity;
            for (let j = 0; j < bgSamples.length; j++) {
              const sLab = bgSamples[j];
              const diff = Math.hypot(nLab.L - sLab.L, nLab.a - sLab.a, nLab.b - sLab.b);
              if (diff < minDiff) minDiff = diff;
            }

            if (minDiff < 24) {
              visited[nPos] = 1;
              queue.push(nx, ny);
            }
          }
        }
      }
    }

    ctx.putImageData(imgData, 0, 0);
    updateCurrentImageFromCanvas(cvs);
  }

  function updateCurrentImageFromCanvas(cvs, onDone) {
    const newImg = new Image();
    newImg.onload = () => {
      currentImage = newImg;
      const origImgEl = document.getElementById("originalImg");
      origImgEl.src = currentImage.src;
      origImgEl.style.width = currentImage.width + "px";
      origImgEl.style.height = currentImage.height + "px";

      cropOverlay.width = currentImage.width;
      cropOverlay.height = currentImage.height;
      cropOverlay.style.width = currentImage.width + "px";
      cropOverlay.style.height = currentImage.height + "px";

      updateOrigDimensionsLabel();

      setUploadTool('none');
      processImageCore(false, "去背與裁切");
      pushUploadHistoryState();
      scheduleFaceDetect();
      setTimeout(() => { fitOrigToWindow(); }, 30);
      if (typeof onDone === "function") onDone();
    };
    newImg.src = cvs.toDataURL("image/png");
  }

  // ==========================================
  // 圖紙收藏庫功能 (LocalStorage)
  // ==========================================
  const LIBRARY_STORAGE_KEY = "bead_pattern_library_v1";

  function getLibraryItems() {
    try {
      return JSON.parse(localStorage.getItem(LIBRARY_STORAGE_KEY)) || [];
    } catch (e) {
      return [];
    }
  }

  function saveLibraryItems(items) {
    try {
      localStorage.setItem(LIBRARY_STORAGE_KEY, JSON.stringify(items));
    } catch (e) {
      alert("儲存空間不足，無法儲存更多圖紙！");
    }
  }

  function saveCurrentPatternToLibrary() {
    if (!currentImage || patternGridData.length === 0) {
      alert("目前尚無圖紙資料可供收藏！");
      return;
    }

    const title = prompt("請輸入此份圖紙的收藏名稱：", `拼豆圖紙_${new Date().toLocaleDateString()}`);
    if (!title) return;

    // 建立輕量縮圖
    const thumbCanvas = document.createElement("canvas");
    thumbCanvas.width = currentCols;
    thumbCanvas.height = currentRows;
    const tCtx = thumbCanvas.getContext("2d");
    for (let y = 0; y < currentRows; y++) {
      for (let x = 0; x < currentCols; x++) {
        const bead = patternGridData[y]?.[x];
        if (bead) {
          tCtx.fillStyle = bead.hex;
          tCtx.fillRect(x, y, 1, 1);
        }
      }
    }

    const newItem = {
      id: "lib_" + Date.now(),
      title: title,
      date: new Date().toLocaleString(),
      cols: currentCols,
      rows: currentRows,
      grid: cloneGrid(patternGridData),
      imageSrc: currentImage.src,
      thumbnail: thumbCanvas.toDataURL("image/png"),
      sliders: getSliderState()
    };

    const items = getLibraryItems();
    items.unshift(newItem);
    saveLibraryItems(items);
    alert(`圖紙「${title}」已成功收藏！`);
  }

  function renderLibraryGrid() {
    const items = getLibraryItems();
    const grid = document.getElementById("libraryGrid");
    const emptyNotice = document.getElementById("libraryEmpty");
    const badge = document.getElementById("libraryCountBadge");

    badge.textContent = `${items.length} 份`;
    grid.innerHTML = "";

    if (items.length === 0) {
      emptyNotice.style.display = "block";
      return;
    }

    emptyNotice.style.display = "none";
    items.forEach(item => {
      const card = document.createElement("div");
      card.className = "library-card";
      card.innerHTML = `
        <img src="${item.thumbnail}" alt="${item.title}" />
        <div class="library-card-body">
          <div class="library-card-title">${item.title}</div>
          <div class="library-card-meta">${item.cols} × ${item.rows} 格 (${item.date})</div>
          <div class="library-card-actions">
            <button class="zoom-btn highlight" onclick="loadPatternFromLibrary('${item.id}')">📂 載入</button>
            <button class="zoom-btn reset-btn" onclick="deletePatternFromLibrary('${item.id}')">🗑 刪除</button>
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  function loadPatternFromLibrary(id) {
    const items = getLibraryItems();
    const item = items.find(it => it.id === id);
    if (!item) return;

    currentImage = new Image();
    currentImage.onload = () => {
      rawSourceImage = currentImage;
      const origImgEl = document.getElementById("originalImg");
      origImgEl.src = currentImage.src;
      origImgEl.style.display = "block";
      origImgEl.style.width = currentImage.width + "px";
      origImgEl.style.height = currentImage.height + "px";

      document.getElementById("origPlaceholder").style.display = "none";
      document.body.classList.add("has-upload-image");
      document.getElementById("uploadHintBanner").style.display = "block";
      updateOrigDimensionsLabel();

      cropOverlay.width = currentImage.width;
      cropOverlay.height = currentImage.height;
      cropOverlay.style.width = currentImage.width + "px";
      cropOverlay.style.height = currentImage.height + "px";

      patternGridData = cloneGrid(item.grid);
      currentCols = item.cols;
      currentRows = item.rows;
      baseCellSize = parseInt(item.sliders.gridSize, 10);
      setSliderState(item.sliders);

      updatePatternDimensionsLabel();

      historyStack = [];
      historyIndex = -1;
      pushHistoryState("載入收藏圖紙");

      clearSelection();
      recalculateStats();
      resizeCanvases();
      renderBasePattern();
      renderGrid();
      renderInteractionLayer();
      document.getElementById("downloadBtn").disabled = false;
      scheduleFaceDetect();

      switchStageView("edit");
    };
    currentImage.src = item.imageSrc;
  }

  function deletePatternFromLibrary(id) {
    if (!confirm("確定要刪除這份收藏圖紙嗎？")) return;
    let items = getLibraryItems();
    items = items.filter(it => it.id !== id);
    saveLibraryItems(items);
    renderLibraryGrid();
  }
</script>
</body>
