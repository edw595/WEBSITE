  function readSourcePixels(img) {
    const srcW = img.width, srcH = img.height;
    if (!srcW || !srcH) return null;
    const maxSide = 4096;
    const scale = Math.min(1, maxSide / srcW, maxSide / srcH);
    const sw = Math.max(1, Math.round(srcW * scale));
    const sh = Math.max(1, Math.round(srcH * scale));
    const srcCanvas = document.createElement("canvas");
    srcCanvas.width = sw;
    srcCanvas.height = sh;
    const srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });
    srcCtx.imageSmoothingEnabled = false;
    srcCtx.drawImage(img, 0, 0, sw, sh);
    try {
      return { data: srcCtx.getImageData(0, 0, sw, sh).data, sw, sh };
    } catch (_) {
      return null;
    }
  }

  function integerBlockScale(sw, sh, cols, rows) {
    const kx = Math.floor(sw / Math.max(1, cols));
    const ky = Math.floor(sh / Math.max(1, rows));
    return Math.max(1, Math.min(8, kx, ky) || 1);
  }

  function majorityFromWork(work, workW, k, cols, rows, codeList) {
    const grid = [];
    for (let y = 0; y < rows; y++) {
      grid[y] = new Array(cols).fill(null);
      for (let x = 0; x < cols; x++) {
        const counts = new Map();
        let opaque = 0;
        let centerId = -1;
        const mid = k >> 1;
        for (let ky = 0; ky < k; ky++) {
          for (let kx = 0; kx < k; kx++) {
            const id = work[(y * k + ky) * workW + (x * k + kx)];
            if (id < 0) continue;
            opaque++;
            counts.set(id, (counts.get(id) || 0) + 1);
            if (kx === mid && ky === mid) centerId = id;
          }
        }
        if (!opaque) continue;
        const minKeep = Math.max(1, Math.ceil(opaque * 0.18));
        let best = -1, bestN = -1;
        for (const [id, n] of counts) {
          if (n < minKeep) continue;
          if (n > bestN || (n === bestN && id === centerId)) {
            best = id;
            bestN = n;
          }
        }
        const pick = best >= 0 ? best : centerId;
        if (pick >= 0) grid[y][x] = BEAD_BY_CODE[codeList[pick]] || null;
      }
    }
    return grid;
  }

  function snapWorkFromRgba(src, sw, sh, workW, workH, palette, cache) {
    const codeList = [];
    const codeIndex = new Map();
    const idFor = (bead) => {
      if (!bead) return -1;
      if (!codeIndex.has(bead.code)) {
        codeIndex.set(bead.code, codeList.length);
        codeList.push(bead.code);
      }
      return codeIndex.get(bead.code);
    };
    const work = new Int32Array(workW * workH);
    for (let wy = 0; wy < workH; wy++) {
      const sy = Math.min(sh - 1, Math.floor((wy + 0.5) * sh / workH));
      for (let wx = 0; wx < workW; wx++) {
        const sx = Math.min(sw - 1, Math.floor((wx + 0.5) * sw / workW));
        const i = (sy * sw + sx) * 4;
        work[wy * workW + wx] = idFor(getClosestBeadFromPalette(palette, cache, src[i], src[i + 1], src[i + 2], src[i + 3]));
      }
    }
    return { work, codeList };
  }

  function collectColorComponents(src, w, h) {
    const n = w * h;
    const seen = new Uint8Array(n);
    const comps = [];
    const dirs = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    for (let p = 0; p < n; p++) {
      if (seen[p] || src[p * 4 + 3] < 24) continue;
      const r = src[p * 4], g = src[p * 4 + 1], b = src[p * 4 + 2];
      const stack = [p];
      seen[p] = 1;
      const cells = [p];
      let minX = p % w, maxX = minX, minY = (p / w) | 0, maxY = minY;
      while (stack.length) {
        const q = stack.pop();
        const qx = q % w, qy = (q / w) | 0;
        for (const [dx, dy] of dirs) {
          const nx = qx + dx, ny = qy + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const ni = ny * w + nx;
          if (seen[ni] || src[ni * 4 + 3] < 24) continue;
          if (src[ni * 4] !== r || src[ni * 4 + 1] !== g || src[ni * 4 + 2] !== b) continue;
          seen[ni] = 1;
          stack.push(ni);
          cells.push(ni);
          if (nx < minX) minX = nx;
          if (nx > maxX) maxX = nx;
          if (ny < minY) minY = ny;
          if (ny > maxY) maxY = ny;
        }
      }
      comps.push({ cells, r, g, b, size: cells.length, minX, maxX, minY, maxY });
    }
    return comps;
  }

  function mergeSmallColorRegions(src, w, h, minArea) {
    const out = new Uint8ClampedArray(src);
    const comps = collectColorComponents(out, w, h);
    comps.sort((a, b) => a.size - b.size);
    for (const c of comps) {
      if (c.size >= minArea) continue;
      const neighborCounts = {};
      for (const p of c.cells) {
        const x = p % w, y = (p / w) | 0;
        for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
          const nx = x + dx, ny = y + dy;
          if (nx < 0 || ny < 0 || nx >= w || ny >= h) continue;
          const i = (ny * w + nx) * 4;
          if (out[i + 3] < 24) continue;
          if (out[i] === c.r && out[i + 1] === c.g && out[i + 2] === c.b) continue;
          const key = (out[i] << 16) | (out[i + 1] << 8) | out[i + 2];
          neighborCounts[key] = (neighborCounts[key] || 0) + 1;
        }
      }
      let best = null, bestN = 0;
      for (const key in neighborCounts) {
        if (neighborCounts[key] > bestN) {
          bestN = neighborCounts[key];
          best = Number(key);
        }
      }
      if (best == null) continue;
      const nr = (best >> 16) & 255, ng = (best >> 8) & 255, nb = best & 255;
      for (const p of c.cells) {
        const i = p * 4;
        out[i] = nr; out[i + 1] = ng; out[i + 2] = nb;
      }
    }
    return out;
  }

  function traceOuterContour(cells, w, h, minX, maxX, minY, maxY) {
    const bw = maxX - minX + 3;
    const bh = maxY - minY + 3;
    const mask = new Uint8Array(bw * bh);
    for (const p of cells) {
      const x = (p % w) - minX + 1;
      const y = ((p / w) | 0) - minY + 1;
      mask[y * bw + x] = 1;
    }
    let sx = -1, sy = -1;
    outer: for (let y = 0; y < bh; y++) {
      for (let x = 0; x < bw; x++) {
        if (mask[y * bw + x]) { sx = x; sy = y; break outer; }
      }
    }
    if (sx < 0) return [];
    const dirx = [1, 1, 0, -1, -1, -1, 0, 1];
    const diry = [0, 1, 1, 1, 0, -1, -1, -1];
    const pts = [];
    let x = sx, y = sy, dir = 0;
    const guard = cells.length * 8 + 32;
    for (let step = 0; step < guard; step++) {
      pts.push({ x: x + minX - 1, y: y + minY - 1 });
      let found = false;
      for (let i = 0; i < 8; i++) {
        const nd = (dir + 6 + i) % 8;
        const nx = x + dirx[nd], ny = y + diry[nd];
        if (nx < 0 || ny < 0 || nx >= bw || ny >= bh) continue;
        if (!mask[ny * bw + nx]) continue;
        x = nx; y = ny; dir = nd;
        found = true;
        break;
      }
      if (!found) break;
      if (x === sx && y === sy && pts.length > 2) break;
    }
    return pts;
  }

  function rasterizeVectorBlocks(src, sw, sh, cols, rows, palette) {
    const k = integerBlockScale(sw, sh, cols, rows);
    const workW = k * cols, workH = k * rows;
    const canvas = document.createElement("canvas");
    canvas.width = workW;
    canvas.height = workH;
    const ctx = canvas.getContext("2d", { willReadFrequently: true });
    if (!ctx) return null;
    ctx.imageSmoothingEnabled = false;
    ctx.clearRect(0, 0, workW, workH);
    const comps = collectColorComponents(src, sw, sh);
    comps.sort((a, b) => b.size - a.size);
    for (const c of comps) {
      ctx.fillStyle = `rgb(${c.r},${c.g},${c.b})`;
      if (c.size <= 6) {
        for (const p of c.cells) {
          const x = Math.round(((p % sw) + 0.5) * workW / sw);
          const y = Math.round((((p / sw) | 0) + 0.5) * workH / sh);
          ctx.fillRect(x, y, Math.max(1, Math.round(workW / sw)), Math.max(1, Math.round(workH / sh)));
        }
        continue;
      }
      const contour = traceOuterContour(c.cells, sw, sh, c.minX, c.maxX, c.minY, c.maxY);
      if (contour.length < 3) continue;
      ctx.beginPath();
      for (let i = 0; i < contour.length; i++) {
        const x = (contour[i].x + 0.5) * workW / sw;
        const y = (contour[i].y + 0.5) * workH / sh;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      ctx.fill();
    }
    let painted;
    try {
      painted = ctx.getImageData(0, 0, workW, workH).data;
    } catch (_) {
      return null;
    }
    const cache = new Map();
    const codeList = [];
    const codeIndex = new Map();
    const work = new Int32Array(workW * workH);
    for (let p = 0; p < workW * workH; p++) {
      const i = p * 4;
      if (painted[i + 3] < 128) {
        work[p] = -1;
        continue;
      }
      const bead = getClosestBeadFromPalette(palette, cache, painted[i], painted[i + 1], painted[i + 2], 255);
      if (!bead) { work[p] = -1; continue; }
      if (!codeIndex.has(bead.code)) {
        codeIndex.set(bead.code, codeList.length);
        codeList.push(bead.code);
      }
      work[p] = codeIndex.get(bead.code);
    }
    return majorityFromWork(work, workW, k, cols, rows, codeList);
  }

  function sampleIntegerAligned(src, sw, sh, cols, rows, palette) {
    const k = integerBlockScale(sw, sh, cols, rows);
    const workW = k * cols, workH = k * rows;
    const { work, codeList } = snapWorkFromRgba(src, sw, sh, workW, workH, palette, new Map());
    return majorityFromWork(work, workW, k, cols, rows, codeList);
  }

  function sampleSnappedMajority(img, cols, rows, palette, useVector) {
    try {
      if (!palette || palette.length === 0 || cols < 1 || rows < 1) return null;
      let srcImg = readSourcePixels(img);
      if (!srcImg) return null;
      let { data: src, sw, sh } = srcImg;
      if (useVector) {
        const maxSide = 512;
        if (sw > maxSide || sh > maxSide) {
          const s = Math.min(maxSide / sw, maxSide / sh);
          const nw = Math.max(1, Math.round(sw * s));
          const nh = Math.max(1, Math.round(sh * s));
          const c = document.createElement("canvas");
          c.width = nw; c.height = nh;
          const cctx = c.getContext("2d", { willReadFrequently: true });
          cctx.imageSmoothingEnabled = false;
          const tmp = document.createElement("canvas");
          tmp.width = sw; tmp.height = sh;
          tmp.getContext("2d").putImageData(new ImageData(src, sw, sh), 0, 0);
          cctx.drawImage(tmp, 0, 0, nw, nh);
          src = cctx.getImageData(0, 0, nw, nh).data;
          sw = nw; sh = nh;
        }
        src = posterizeRgba(src, sw, sh, 16);
        src = mergeSmallColorRegions(src, sw, sh, Math.max(10, Math.round(sw * sh * 0.0015)));
        return rasterizeVectorBlocks(src, sw, sh, cols, rows, palette);
      }
      return sampleIntegerAligned(src, sw, sh, cols, rows, palette);
    } catch (_) {
      return null;
    }
  }

  function downsampleCenterSample(img, cols, rows) {
    try {
      const srcW = img.width, srcH = img.height;
      if (!srcW || !srcH || cols < 1 || rows < 1) return null;
      const maxSide = 4096;
      const scale = Math.min(1, maxSide / srcW, maxSide / srcH);
      const sw = Math.max(1, Math.round(srcW * scale));
      const sh = Math.max(1, Math.round(srcH * scale));
      const srcCanvas = document.createElement("canvas");
      srcCanvas.width = sw;
      srcCanvas.height = sh;
      const srcCtx = srcCanvas.getContext("2d", { willReadFrequently: true });
      srcCtx.imageSmoothingEnabled = false;
      srcCtx.drawImage(img, 0, 0, sw, sh);
      let src;
      try {
        src = srcCtx.getImageData(0, 0, sw, sh).data;
      } catch (_) {
        return null;
      }
      if (sw === cols && sh === rows) return src;
      const out = new Uint8ClampedArray(cols * rows * 4);
      for (let y = 0; y < rows; y++) {
        const sy = Math.min(sh - 1, Math.floor((y + 0.5) * sh / rows));
        for (let x = 0; x < cols; x++) {
          const sx = Math.min(sw - 1, Math.floor((x + 0.5) * sw / cols));
          const i = (sy * sw + sx) * 4;
          const oi = (y * cols + x) * 4;
          out[oi] = src[i];
          out[oi + 1] = src[i + 1];
          out[oi + 2] = src[i + 2];
          out[oi + 3] = src[i + 3];
        }
      }
      return out;
    } catch (_) {
      return null;
    }
  }

  function sampleCenterToPalette(img, cols, rows, palette) {
    const sampled = downsampleCenterSample(img, cols, rows);
    if (!sampled) return null;
    const cache = palette === BEAD_PALETTE_120 ? colorCache120 : new Map();
    const grid = [];
    for (let y = 0; y < rows; y++) {
      grid[y] = new Array(cols).fill(null);
      for (let x = 0; x < cols; x++) {
        const i = (y * cols + x) * 4;
        grid[y][x] = getClosestBeadFromPalette(palette, cache, sampled[i], sampled[i + 1], sampled[i + 2], sampled[i + 3]);
      }
    }
    return grid;
  }

  function pickFeaturePreservedId(counts, codeList, centerId, opaque) {
    if (!opaque) return -1;
    let majorityId = -1, majorityN = -1;
    for (const [id, n] of counts) {
      if (n > majorityN || (n === majorityN && id === centerId)) {
        majorityId = id;
        majorityN = n;
      }
    }
    const majority = BEAD_BY_CODE[codeList[majorityId]];
    let bestInk = -1, bestInkN = 0;
    let bestHi = -1, bestHiN = 0;
    for (const [id, n] of counts) {
      const bead = BEAD_BY_CODE[codeList[id]];
      if (isDarkInkBead(bead) && n > bestInkN) {
        bestInk = id;
        bestInkN = n;
      }
      if (isHighlightBead(bead) && n > bestHiN) {
        bestHi = id;
        bestHiN = n;
      }
    }
    const inkShare = bestInkN / opaque;
    const hiShare = bestHiN / opaque;
    const smallCell = opaque <= 4;
    if (bestHi >= 0 && !isHighlightBead(majority)) {
      const onWarm = isWarmFillBead(majority);
      const onInk = isDarkInkBead(majority);
      if ((onWarm || onInk) && (hiShare >= 0.06 || (smallCell && bestHiN >= 1))) {
        return bestHi;
      }
    }
    if (bestInk >= 0 && !isDarkInkBead(majority)) {
      const centerBead = centerId >= 0 ? BEAD_BY_CODE[codeList[centerId]] : null;
      const centerIsInk = isDarkInkBead(centerBead);
      if (centerIsInk || inkShare >= 0.5) return bestInk;
    }
    return majorityId;
  }

  function sampleFeaturePreserving(img, cols, rows, palette) {
    try {
      if (!palette || !palette.length || cols < 1 || rows < 1) return null;
      const srcImg = readSourcePixels(img);
      if (!srcImg) return null;
      const { data: src, sw, sh } = srcImg;
      const cache = palette === BEAD_PALETTE_120 ? colorCache120 : new Map();
      const grid = [];
      for (let y = 0; y < rows; y++) {
        grid[y] = new Array(cols).fill(null);
        const y0 = Math.floor(y * sh / rows);
        const y1 = Math.max(y0 + 1, Math.floor((y + 1) * sh / rows));
        for (let x = 0; x < cols; x++) {
          const x0 = Math.floor(x * sw / cols);
          const x1 = Math.max(x0 + 1, Math.floor((x + 1) * sw / cols));
          const counts = new Map();
          const codeIndex = new Map();
          const codeList = [];
          let opaque = 0;
          let centerId = -1;
          const cx = Math.min(sw - 1, Math.floor((x + 0.5) * sw / cols));
          const cy = Math.min(sh - 1, Math.floor((y + 0.5) * sh / rows));
          const idFor = (bead) => {
            if (!bead) return -1;
            if (!codeIndex.has(bead.code)) {
              codeIndex.set(bead.code, codeList.length);
              codeList.push(bead.code);
            }
            return codeIndex.get(bead.code);
          };
          for (let sy = y0; sy < y1; sy++) {
            for (let sx = x0; sx < x1; sx++) {
              const i = (sy * sw + sx) * 4;
              const id = idFor(snapAutoPixel(palette, cache, src[i], src[i + 1], src[i + 2], src[i + 3]));
              if (id < 0) continue;
              opaque++;
              counts.set(id, (counts.get(id) || 0) + 1);
              if (sx === cx && sy === cy) centerId = id;
            }
          }
          const pick = pickFeaturePreservedId(counts, codeList, centerId, opaque);
          if (pick >= 0) grid[y][x] = BEAD_BY_CODE[codeList[pick]] || null;
        }
      }
      return grid;
    } catch (_) {
      return null;
    }
  }

  function mergeScatteredSpeckles(grid, cols, rows) {
    const counts = countGridColors(grid, cols, rows);
    const total = totalBeadCount(counts);
    if (total < 8) return grid;
    const codes = Object.keys(counts).filter((code) => BEAD_BY_CODE[code]);
    codes.sort((a, b) => counts[a] - counts[b]);
    const map = {};
    for (const code of codes) map[code] = code;

    const n = cols * rows;
    const seen = new Uint8Array(n);
    function isCompactColor(code) {
      seen.fill(0);
      let components = 0;
      let compactOnes = 0;
      for (let i = 0; i < n; i++) {
        const y = (i / cols) | 0, x = i % cols;
        if (seen[i] || grid[y][x]?.code !== code) continue;
        let size = 0, minX = x, maxX = x, minY = y, maxY = y;
        const stack = [i];
        seen[i] = 1;
        while (stack.length) {
          const p = stack.pop();
          const px = p % cols, py = (p / cols) | 0;
          size++;
          if (px < minX) minX = px;
          if (px > maxX) maxX = px;
          if (py < minY) minY = py;
          if (py > maxY) maxY = py;
          for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
            const nx = px + dx, ny = py + dy;
            if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
            const ni = ny * cols + nx;
            if (seen[ni] || grid[ny][nx]?.code !== code) continue;
            seen[ni] = 1;
            stack.push(ni);
          }
        }
        components++;
        const bbox = (maxX - minX + 1) * (maxY - minY + 1);
        if (size >= 2 && size <= 48 && bbox <= size * 3.5) compactOnes++;
      }
      return compactOnes >= 1 && components <= 4;
    }

    for (const small of codes) {
      const bead = BEAD_BY_CODE[small];
      if (isDarkInkBead(bead) || isHighlightBead(bead)) continue;
      if (counts[small] > total * 0.018 && counts[small] > 16) continue;
      if (isCompactColor(small)) continue;
      let best = null, bestD = Infinity;
      for (const large of codes) {
        if (large === small) continue;
        if (counts[large] < counts[small] * 2) continue;
        const other = BEAD_BY_CODE[large];
        if (isDarkInkBead(other) || isHighlightBead(other)) continue;
        const d = ciede2000(bead.lab, other.lab);
        if (d < bestD) {
          bestD = d;
          best = large;
        }
      }
      if (best != null && bestD < 4.2) map[small] = map[best] || best;
    }

    return grid.map((row, y) => row.map((cell, x) => {
      if (!cell) return cell;
      const dest = map[cell.code];
      return dest && dest !== cell.code && BEAD_BY_CODE[dest] ? BEAD_BY_CODE[dest] : cell;
    }));
  }

  function processImageCore(isInitial = false, actionName = "濾鏡調整") {
    if (!currentImage) return;

    currentCols = parseInt(document.getElementById("beadWidth").value, 10);
    baseCellSize = parseInt(document.getElementById("gridSize").value, 10);
    const contrast = parseInt(document.getElementById("contrast").value, 10);
    const brightness = parseInt(document.getElementById("brightness").value, 10);
    const saturation = parseInt(document.getElementById("saturation").value, 10);
    const sharpen = parseInt(document.getElementById("sharpen").value, 10);
    const samplingMode = document.getElementById("samplingMode").value;
    const cleanNoise = document.getElementById("cleanNoise").checked;
    const maxColors = readMaxColorLimit();
    const highlights = parseInt(document.getElementById("highlights").value, 10) || 0;
    const lights = parseInt(document.getElementById("lights").value, 10) || 0;
    const blacks = parseInt(document.getElementById("blacks").value, 10) || 0;
    const shadows = parseInt(document.getElementById("shadows").value, 10) || 0;
    let sourceImg = bakeHighlightShadowImage(currentImage, highlights, shadows, lights, blacks);
    if (autoDetectActive) {
      sourceImg = bakeManualAdjustImage(sourceImg, brightness, contrast, saturation);
      if (sharpen > 0) sourceImg = bakeSharpenImage(sourceImg, sharpen);
      if (samplingMode === "smooth") sourceImg = bakeSoftBlurImage(sourceImg);
    }

    const scale = currentCols / currentImage.width;
    currentRows = Math.max(1, Math.round(currentImage.height * scale));

    updatePatternDimensionsLabel();
    updateBeadSizeLabel(currentCols);

    const sampleCanvas = document.createElement("canvas");
    sampleCanvas.width = currentCols; sampleCanvas.height = currentRows;
    const sCtx = sampleCanvas.getContext("2d", { willReadFrequently: true });
    sCtx.imageSmoothingEnabled = (samplingMode !== "pixel");
    sCtx.imageSmoothingQuality = "high";
    sCtx.drawImage(sourceImg, 0, 0, currentCols, currentRows);

    let rawImgData = sCtx.getImageData(0, 0, currentCols, currentRows).data;
    if (!autoDetectActive && samplingMode === "pixel") {
      try {
        const sampled = downsampleCenterSample(sourceImg, currentCols, currentRows);
        if (sampled) rawImgData = sampled;
      } catch (_) {}
    }
    if (sharpen > 0 && !autoDetectActive) {
      rawImgData = applySharpenKernel(rawImgData, currentCols, currentRows, sharpen);
    }

    patternGridData = [];
    for (let r = 0; r < currentRows; r++) patternGridData[r] = new Array(currentCols).fill(null);

    let usedSnappedGrid = false;
    if (autoDetectActive) {
      try {
        const preserved = sampleFeaturePreserving(sourceImg, currentCols, currentRows, BEAD_PALETTE_120);
        if (preserved && preserved.length === currentRows) {
          patternGridData = preserved;
          usedSnappedGrid = true;
        }
      } catch (_) {}
    }

    if (!usedSnappedGrid) {
      for (let y = 0; y < currentRows; y++) {
        for (let x = 0; x < currentCols; x++) {
          const idx = (y * currentCols + x) * 4;
          if (rawImgData[idx + 3] < 64) continue;
          if (autoDetectActive) {
            patternGridData[y][x] = getClosestBeadFromPalette(BEAD_PALETTE_120, colorCache120, rawImgData[idx], rawImgData[idx + 1], rawImgData[idx + 2], 255);
          } else {
            const adj = applyAdjustments(rawImgData[idx], rawImgData[idx + 1], rawImgData[idx + 2], brightness, contrast, saturation);
            patternGridData[y][x] = getClosestBeadLab(adj.r, adj.g, adj.b, 255);
          }
        }
      }
    }

    if (cleanNoise) {
      patternGridData = applyDenoiseFilter(patternGridData, currentCols, currentRows);
    }
    if (autoDetectActive) {
      if (maxColors) patternGridData = limitGridToMaxColors(patternGridData, currentCols, currentRows, maxColors);
      else patternGridData = mergeScatteredSpeckles(patternGridData, currentCols, currentRows);
    } else if (maxColors) {
      patternGridData = limitGridToMaxColors(patternGridData, currentCols, currentRows, maxColors);
    }

    applySuggestedEditZoom();

    pushHistoryState(actionName);
    clearSelection();
    recalculateStats();
    resizeCanvases();
    renderBasePattern();
    renderGrid();
    renderInteractionLayer();
    document.getElementById("downloadBtn").disabled = false;
    const autoBtn = document.getElementById("autoDetectBtn");
    if (autoBtn) autoBtn.disabled = false;
    if (currentStage === "edit") syncFloatingZoomBar();
    if (actionName === "調整寬度") centerPatternInView();
  }

  function recalculateStats() {
    const counts = {};
    let totalCount = 0;
    for (let y = 0; y < currentRows; y++) {
      for (let x = 0; x < currentCols; x++) {
        const bead = patternGridData[y]?.[x];
        if (bead) {
          counts[bead.code] = (counts[bead.code] || 0) + 1;
          totalCount++;
        }
      }
    }
    updateStats(counts, totalCount);
    updateColorFilterBar(counts);
    snapMaxColorsSliderToUsed();
  }

  function filterByColor(code) {
    highlightedColorCode = code;
    recalculateStats();
    renderBasePattern();
  }

  function updateColorFilterBar(counts) {
    const colorFilterCard = document.getElementById("colorFilterCard");
    const paletteFilterItems = document.getElementById("paletteFilterItems");
    const filterStatusText = document.getElementById("filterStatusText");
    const allColorsBtn = document.getElementById("allColorsBtn");

    const codes = Object.keys(counts).sort((a, b) => counts[b] - counts[a]);
    if (codes.length === 0) {
      colorFilterCard.style.display = "none";
      requestAnimationFrame(syncFloatingDockFrost);
      return;
    }

    colorFilterCard.style.display = "flex";
    paletteFilterItems.innerHTML = "";
    allColorsBtn.className = (highlightedColorCode === null) ? "all-colors-btn active" : "all-colors-btn";

    codes.forEach(code => {
      const bead = BEAD_PALETTE.find(b => b.code === code);
      if (!bead) return;
      const isCurrentActive = (highlightedColorCode === code);
      const isDimmed = (highlightedColorCode !== null && !isCurrentActive);

      const btn = document.createElement("button");
      btn.className = `color-filter-btn ${isCurrentActive ? 'active' : ''} ${isDimmed ? 'dimmed' : ''}`;
      btn.style.backgroundColor = bead.hex;
      btn.style.color = (bead.lab.L > 55) ? "#000000" : "#ffffff";
      btn.title = `色號: ${bead.code} (${counts[code]} 顆)`;
      btn.textContent = bead.code;
      btn.onclick = () => { filterByColor(highlightedColorCode === code ? null : code); };
      paletteFilterItems.appendChild(btn);
    });
    filterStatusText.textContent = highlightedColorCode ? `📍 正凸顯色號：【${highlightedColorCode}】` : "(點擊顏色單獨顯示該色，其他暗掉)";
    filterStatusText.style.color = highlightedColorCode ? "var(--highlight-active)" : "var(--text-sub)";
    requestAnimationFrame(syncFloatingDockFrost);
  }

  function resizeCanvases() {
    if (currentCols === 0) return;
    const { displayW, displayH } = patternDisplaySize();
    let maxDim = MAX_CANVAS_DIM;

    const applySize = (limit) => {
      let bufW = displayW, bufH = displayH;
      const over = Math.max(bufW / limit, bufH / limit, 1);
      if (over > 1) {
        bufW = Math.max(1, Math.floor(bufW / over));
        bufH = Math.max(1, Math.floor(bufH / over));
      }
      mainCanvasWrapper.style.width = `${displayW}px`;
      mainCanvasWrapper.style.height = `${displayH}px`;
      [patternCanvas, gridCanvas, interactionCanvas, compareCanvas].forEach(canvas => {
        setCanvasBuffer(canvas, bufW, bufH, displayW, displayH);
      });
    };

    applySize(maxDim);
    if (!canvasBufferIsDrawable(patternCanvas, ctxPattern)) {
      applySize(4096);
    }
    if (!canvasBufferIsDrawable(patternCanvas, ctxPattern)) {
      applySize(2048);
    }
    ctxPattern.imageSmoothingEnabled = false;
    ctxGrid.imageSmoothingEnabled = false;
    ctxInteract.imageSmoothingEnabled = false;
  }

  let gridGuideVisible = false;
  function readGridGuideStep(id) {
    const n = parseInt(document.getElementById(id).value, 10);
    if (!Number.isFinite(n) || n < 1) return 5;
    return Math.min(200, n);
  }
  function applyGridGuideFromInputs() {
    const xEl = document.getElementById("gridGuideX");
    const yEl = document.getElementById("gridGuideY");
    if (xEl) xEl.value = String(readGridGuideStep("gridGuideX"));
    if (yEl) yEl.value = String(readGridGuideStep("gridGuideY"));
    renderGrid();
  }
  function setGridGuideVisible(on) {
    gridGuideVisible = !!on;
    const eye = document.getElementById("gridGuideEye");
    if (eye) {
      eye.classList.toggle("is-off", !gridGuideVisible);
      eye.setAttribute("aria-pressed", gridGuideVisible ? "true" : "false");
      eye.title = gridGuideVisible ? "顯示紅格線" : "隱藏紅格線";
      eye.setAttribute("aria-label", eye.title);
    }
    renderGrid();
  }

  function renderGrid() {
    if (currentCols === 0) return;
    const cell = gridCanvas.width / currentCols;
    const totalW = gridCanvas.width;
    const totalH = gridCanvas.height;
    ctxGrid.clearRect(0, 0, totalW, totalH);
    ctxGrid.beginPath();
    
    for (let x = 0; x <= currentCols; x++) {
      const curX = Math.round(x * cell);
      ctxGrid.moveTo(curX, 0); ctxGrid.lineTo(curX, totalH);
    }
    for (let y = 0; y <= currentRows; y++) {
      const curY = Math.round(y * cell);
      ctxGrid.moveTo(0, curY); ctxGrid.lineTo(totalW, curY);
    }
    ctxGrid.strokeStyle = "rgba(255,255,255,0.08)";
    ctxGrid.lineWidth = 0.8;
    ctxGrid.stroke();

    if (gridGuideVisible) {
      const stepX = readGridGuideStep("gridGuideX");
      const stepY = readGridGuideStep("gridGuideY");
      ctxGrid.beginPath();
      for (let x = stepX; x < currentCols; x += stepX) {
        const curX = Math.round(x * cell);
        ctxGrid.moveTo(curX, 0); ctxGrid.lineTo(curX, totalH);
      }
      ctxGrid.strokeStyle = "#ff3344";
      ctxGrid.lineWidth = 1.2;
      ctxGrid.stroke();

      ctxGrid.beginPath();
      ctxGrid.setLineDash([4, 3]);
      for (let y = stepY; y < currentRows; y += stepY) {
        const curY = Math.round(y * cell);
        ctxGrid.moveTo(0, curY); ctxGrid.lineTo(totalW, curY);
      }
      ctxGrid.stroke();
      ctxGrid.setLineDash([]);
    }
  }

  function renderBasePattern() {
    if (patternGridData.length === 0 || currentCols === 0 || !patternCanvas.width) return;
    const cell = patternCanvas.width / currentCols;
    const totalW = patternCanvas.width;
    const totalH = patternCanvas.height;
    const showLabels = document.getElementById("showLabels").checked;

    ctxPattern.globalAlpha = 1;
    ctxPattern.fillStyle = "#181825";
    ctxPattern.fillRect(0, 0, totalW, totalH);

    for (let y = 0; y < currentRows; y++) {
      for (let x = 0; x < currentCols; x++) {
        const bead = patternGridData[y]?.[x];
        const posX = Math.round(x * cell), posY = Math.round(y * cell);
        const curCellW = Math.round((x + 1) * cell) - posX;
        const curCellH = Math.round((y + 1) * cell) - posY;

        if (bead) {
          const isMatched = (highlightedColorCode === null || bead.code === highlightedColorCode);
          if (isMatched) {
            ctxPattern.fillStyle = bead.hex;
            ctxPattern.fillRect(posX, posY, curCellW, curCellH);

            if (showLabels && cell >= 14) {
              ctxPattern.fillStyle = (bead.lab.L > 55) ? "rgba(0,0,0,0.85)" : "rgba(255,255,255,0.95)";
              ctxPattern.font = `bold ${Math.max(8, Math.floor(cell * 0.36))}px monospace`;
              ctxPattern.textAlign = "center"; ctxPattern.textBaseline = "middle";
              ctxPattern.fillText(bead.code, posX + curCellW / 2, posY + curCellH / 2);
            }
          } else {
            ctxPattern.fillStyle = "#222330";
            ctxPattern.fillRect(posX, posY, curCellW, curCellH);
            ctxPattern.fillStyle = bead.hex;
            ctxPattern.globalAlpha = 0.12;
            ctxPattern.fillRect(posX, posY, curCellW, curCellH);
            ctxPattern.globalAlpha = 1.0;
          }
        } else {
          ctxPattern.fillStyle = "#1e1e2e";
          ctxPattern.fillRect(posX + 1, posY + 1, curCellW - 2, curCellH - 2);
        }
      }
    }
    renderHeaders();
    renderCompareCanvas();
    updateMinimap();
  }

  const MINIMAP_MAX = 136;
  const minimapWrap = document.getElementById("patternMinimap");
  const minimapCanvas = document.getElementById("minimapCanvas");
  const minimapViewport = document.getElementById("minimapViewport");
  const minimapCtx = minimapCanvas.getContext("2d", { alpha: false });
  let minimapViewportRaf = 0;
  let minimapDragging = false;

  function scheduleMinimapViewport() {
    if (minimapViewportRaf) return;
    minimapViewportRaf = requestAnimationFrame(() => {
      minimapViewportRaf = 0;
      updateMinimapViewport();
    });
  }

  function updateMinimap() {
    if (!minimapWrap) return;
    if (currentStage !== "edit" || currentCols === 0 || patternGridData.length === 0) {
      minimapWrap.classList.remove("is-ready");
      return;
    }

    const scale = Math.min(MINIMAP_MAX / currentCols, MINIMAP_MAX / currentRows, 4);
    const w = Math.max(24, Math.round(currentCols * scale));
    const h = Math.max(24, Math.round(currentRows * scale));
    minimapCanvas.width = w;
    minimapCanvas.height = h;
    minimapWrap.style.width = `${w}px`;
    minimapWrap.style.height = `${h}px`;

    const img = minimapCtx.createImageData(w, h);
    const data = img.data;
    const bgR = 24, bgG = 24, bgB = 37;
    for (let py = 0; py < h; py++) {
      const row = Math.min(currentRows - 1, Math.floor(py * currentRows / h));
      for (let px = 0; px < w; px++) {
        const col = Math.min(currentCols - 1, Math.floor(px * currentCols / w));
        const bead = patternGridData[row]?.[col];
        const i = (py * w + px) * 4;
        if (bead) {
          data[i] = bead.r;
          data[i + 1] = bead.g;
          data[i + 2] = bead.b;
        } else {
          data[i] = bgR;
          data[i + 1] = bgG;
          data[i + 2] = bgB;
        }
        data[i + 3] = 255;
      }
    }
    minimapCtx.putImageData(img, 0, 0);
    minimapWrap.classList.add("is-ready");
    updateMinimapViewport();
  }

  function updateMinimapViewport() {
    if (!minimapWrap || !minimapWrap.classList.contains("is-ready")) return;
    const contentW = mainCanvasWrapper.offsetWidth || patternCanvas.width || 1;
    const contentH = mainCanvasWrapper.offsetHeight || patternCanvas.height || 1;
    const mapW = minimapWrap.clientWidth || minimapCanvas.width;
    const mapH = minimapWrap.clientHeight || minimapCanvas.height;
    const viewW = Math.min(mainScroll.clientWidth, contentW);
    const viewH = Math.min(mainScroll.clientHeight, contentH);
    const left = (mainScroll.scrollLeft / contentW) * mapW;
    const top = (mainScroll.scrollTop / contentH) * mapH;
    const width = Math.max(8, (viewW / contentW) * mapW);
    const height = Math.max(8, (viewH / contentH) * mapH);
    minimapViewport.style.transform = `translate(${left}px, ${top}px)`;
    minimapViewport.style.width = `${width}px`;
    minimapViewport.style.height = `${height}px`;
  }

  function panFromMinimap(clientX, clientY) {
    const rect = minimapWrap.getBoundingClientRect();
    const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
    const y = Math.max(0, Math.min(1, (clientY - rect.top) / rect.height));
    const contentW = mainCanvasWrapper.offsetWidth || patternCanvas.width || 1;
    const contentH = mainCanvasWrapper.offsetHeight || patternCanvas.height || 1;
    mainScroll.scrollLeft = x * contentW - mainScroll.clientWidth / 2;
    mainScroll.scrollTop = y * contentH - mainScroll.clientHeight / 2;
  }

  minimapWrap.addEventListener("pointerdown", (e) => {
    if (!minimapWrap.classList.contains("is-ready")) return;
    e.preventDefault();
    minimapDragging = true;
    minimapWrap.classList.add("is-dragging");
    minimapWrap.setPointerCapture(e.pointerId);
    panFromMinimap(e.clientX, e.clientY);
  });
  minimapWrap.addEventListener("pointermove", (e) => {
    if (!minimapDragging) return;
    panFromMinimap(e.clientX, e.clientY);
  });
  function endMinimapDrag(e) {
    if (!minimapDragging) return;
    minimapDragging = false;
    minimapWrap.classList.remove("is-dragging");
    if (e && e.pointerId != null) {
      try { minimapWrap.releasePointerCapture(e.pointerId); } catch (_) {}
    }
  }
  minimapWrap.addEventListener("pointerup", endMinimapDrag);
  minimapWrap.addEventListener("pointercancel", endMinimapDrag);

  (function initGridGuideDock() {
    const dock = document.getElementById("gridGuideDock");
    const xEl = document.getElementById("gridGuideX");
    const yEl = document.getElementById("gridGuideY");
    const eye = document.getElementById("gridGuideEye");
    if (!dock || !xEl || !yEl || !eye) return;

    const onStepChange = () => applyGridGuideFromInputs();
    const bindDigitsOnly = (el) => {
      el.addEventListener("beforeinput", (e) => {
        if (e.data && /\D/.test(e.data)) e.preventDefault();
      });
      el.addEventListener("keydown", (e) => {
        if (e.key === "Enter") {
          e.preventDefault();
          onStepChange();
          el.blur();
          return;
        }
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key.length === 1 && /\D/.test(e.key)) e.preventDefault();
      });
      el.addEventListener("paste", (e) => {
        e.preventDefault();
        const digits = (e.clipboardData || window.clipboardData).getData("text").replace(/\D/g, "").slice(0, 3);
        if (!digits) return;
        const start = el.selectionStart ?? el.value.length;
        const end = el.selectionEnd ?? el.value.length;
        el.value = (el.value.slice(0, start) + digits + el.value.slice(end)).replace(/\D/g, "").slice(0, 3);
        el.dispatchEvent(new Event("input", { bubbles: true }));
      });
      el.addEventListener("input", () => {
        const digits = el.value.replace(/\D/g, "").slice(0, 3);
        if (el.value !== digits) el.value = digits;
        if (parseInt(el.value, 10) >= 1) renderGrid();
      });
      el.addEventListener("change", onStepChange);
      el.addEventListener("blur", onStepChange);
    };
    bindDigitsOnly(xEl);
    bindDigitsOnly(yEl);
    eye.addEventListener("click", (e) => {
      e.stopPropagation();
      setGridGuideVisible(!gridGuideVisible);
    });
    dock.addEventListener("click", (e) => {
      if (e.target.closest("input") || e.target.closest(".grid-guide-eye")) return;
      dock.classList.toggle("is-open");
    });
    document.addEventListener("pointerdown", (e) => {
      if (!dock.contains(e.target)) dock.classList.remove("is-open");
    });
  })();

  function getVisibleSelectionBounds() {
    if (!selectedCells.size) return null;
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    let visible = 0;
    selectedCells.forEach(key => {
      const [x, y] = key.split(",").map(Number);
      const px = x + ((isMovingSelection || isMovingMarquee) ? moveOffset.dx : 0);
      const py = y + ((isMovingSelection || isMovingMarquee) ? moveOffset.dy : 0);
      if (px < 0 || py < 0 || px >= currentCols || py >= currentRows) return;
      visible++;
      if (px < minX) minX = px;
      if (py < minY) minY = py;
      if (px > maxX) maxX = px;
      if (py > maxY) maxY = py;
    });
    if (!visible) return null;
    const filled = visible === (maxX - minX + 1) * (maxY - minY + 1);
    return { minX, minY, maxX, maxY, filled };
  }

  const POLY_CLOSE_HIT = 0.7;
  function isHoveringPolyCloseAnchor() {
    if (editPolyPoints.length < 3 || !editPolyHover || isPolyHandleDrag) return false;
    const first = editPolyPoints[0];
    return Math.hypot(editPolyHover.x - first.x, editPolyHover.y - first.y) < POLY_CLOSE_HIT;
  }

  function renderInteractionLayer() {
    if (currentCols === 0) return;
    const cell = interactionCanvas.width / currentCols;
    const totalW = interactionCanvas.width;
    const totalH = interactionCanvas.height;
    ctxInteract.clearRect(0, 0, totalW, totalH);

    const selBounds = getVisibleSelectionBounds();
    if (selBounds) {
      const movingPixels = isMovingSelection && (moveOffset.dx || moveOffset.dy);
      if (movingPixels) {
        const showLabels = document.getElementById("showLabels").checked;
        selectedCells.forEach(key => {
          const [x, y] = key.split(",").map(Number);
          const bead = patternGridData[y]?.[x];
          if (!bead) return;
          const px = x + moveOffset.dx;
          const py = y + moveOffset.dy;
          if (px < 0 || py < 0 || px >= currentCols || py >= currentRows) return;
          const posX = Math.round(px * cell), posY = Math.round(py * cell);
          const curCellW = Math.round((px + 1) * cell) - posX;
          const curCellH = Math.round((py + 1) * cell) - posY;
          ctxInteract.fillStyle = bead.hex;
          ctxInteract.fillRect(posX, posY, curCellW, curCellH);
          if (showLabels && cell >= 14) {
            ctxInteract.fillStyle = (bead.lab && bead.lab.L > 55) ? "rgba(0,0,0,0.85)" : "rgba(255,255,255,0.95)";
            ctxInteract.font = `bold ${Math.max(8, Math.floor(cell * 0.36))}px monospace`;
            ctxInteract.textAlign = "center";
            ctxInteract.textBaseline = "middle";
            ctxInteract.fillText(bead.code, posX + curCellW / 2, posY + curCellH / 2);
          }
        });
      }
      ctxInteract.fillStyle = movingPixels ? "rgba(0, 150, 255, 0.16)" : "rgba(0, 150, 255, 0.4)";
      if (selBounds.filled) {
        const posX = Math.round(selBounds.minX * cell);
        const posY = Math.round(selBounds.minY * cell);
        ctxInteract.fillRect(
          posX, posY,
          Math.round((selBounds.maxX + 1) * cell) - posX,
          Math.round((selBounds.maxY + 1) * cell) - posY
        );
      } else {
        selectedCells.forEach(key => {
          const [x, y] = key.split(",").map(Number);
          const px = x + ((isMovingSelection || isMovingMarquee) ? moveOffset.dx : 0);
          const py = y + ((isMovingSelection || isMovingMarquee) ? moveOffset.dy : 0);
          if (px < 0 || py < 0 || px >= currentCols || py >= currentRows) return;
          const posX = Math.round(px * cell), posY = Math.round(py * cell);
          ctxInteract.fillRect(
            posX, posY,
            Math.round((px + 1) * cell) - posX,
            Math.round((py + 1) * cell) - posY
          );
        });
      }
      const boxX = Math.round(selBounds.minX * cell);
      const boxY = Math.round(selBounds.minY * cell);
      const boxW = Math.round((selBounds.maxX + 1) * cell) - boxX;
      const boxH = Math.round((selBounds.maxY + 1) * cell) - boxY;
      ctxInteract.strokeStyle = "#0088ff";
      ctxInteract.lineWidth = Math.max(2, Math.floor(cell * 0.12));
      ctxInteract.strokeRect(boxX + 1, boxY + 1, boxW - 2, boxH - 2);
      const handleBox = isScalingSelection && scalePreviewBounds ? scalePreviewBounds : selBounds;
      if (isScalingSelection && scalePreviewBounds) {
        const pX = Math.round(scalePreviewBounds.minX * cell);
        const pY = Math.round(scalePreviewBounds.minY * cell);
        const pW = Math.round((scalePreviewBounds.maxX + 1) * cell) - pX;
        const pH = Math.round((scalePreviewBounds.maxY + 1) * cell) - pY;
        ctxInteract.save();
        ctxInteract.setLineDash([5, 4]);
        ctxInteract.strokeStyle = "#ffe600";
        ctxInteract.lineWidth = Math.max(2, Math.floor(cell * 0.1));
        ctxInteract.strokeRect(pX + 1, pY + 1, pW - 2, pH - 2);
        ctxInteract.restore();
      }
      if (canScaleSelection() && !isMovingSelection && !isMovingMarquee && !(isMouseDown && dragStartCell && !isScalingSelection)) {
        const hs = selectionHandleDrawSize(cell);
        selectionHandlePoints(handleBox, cell).forEach((h) => {
          ctxInteract.fillStyle = "#ffffff";
          ctxInteract.strokeStyle = "#0088ff";
          ctxInteract.lineWidth = 1.5;
          ctxInteract.fillRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
          ctxInteract.strokeRect(h.x - hs, h.y - hs, hs * 2, hs * 2);
        });
      }
      if (canMoveMarquee() && !isMovingSelection && !(isMouseDown && dragStartCell && !isMovingMarquee)) {
        drawMarqueeMoveHandle(ctxInteract, handleBox, cell);
      }
    }

    if (isAnchorSelectTool() && editPolyPoints.length) {
      const last = editPolyPoints[editPolyPoints.length - 1];
      const closeHover = isHoveringPolyCloseAnchor();
      const hoverPt = closeHover ? editPolyPoints[0] : editPolyHover;
      ctxInteract.save();
      ctxInteract.beginPath();
      ctxInteract.moveTo(editPolyPoints[0].x * cell, editPolyPoints[0].y * cell);
      for (let i = 1; i < editPolyPoints.length; i++) {
        const a = editPolyPoints[i - 1], b = editPolyPoints[i];
        const c1 = a.hOut || a;
        const c2 = b.hIn || b;
        if (a.hOut || b.hIn) ctxInteract.bezierCurveTo(c1.x * cell, c1.y * cell, c2.x * cell, c2.y * cell, b.x * cell, b.y * cell);
        else ctxInteract.lineTo(b.x * cell, b.y * cell);
      }
      if (hoverPt && !isPolyHandleDrag) {
        const c1 = last.hOut || last;
        if (last.hOut) ctxInteract.bezierCurveTo(c1.x * cell, c1.y * cell, hoverPt.x * cell, hoverPt.y * cell, hoverPt.x * cell, hoverPt.y * cell);
        else ctxInteract.lineTo(hoverPt.x * cell, hoverPt.y * cell);
      }
      ctxInteract.strokeStyle = closeHover ? "#00ff88" : "#ff6b9d";
      ctxInteract.lineWidth = Math.max(2, Math.floor(cell * 0.1));
      ctxInteract.setLineDash([6, 4]);
      ctxInteract.stroke();
      ctxInteract.setLineDash([]);
      editPolyPoints.forEach((p, i) => {
        if (p.hIn) {
          ctxInteract.beginPath();
          ctxInteract.moveTo(p.x * cell, p.y * cell);
          ctxInteract.lineTo(p.hIn.x * cell, p.hIn.y * cell);
          ctxInteract.strokeStyle = "rgba(255, 230, 0, 0.85)";
          ctxInteract.lineWidth = 1.2;
          ctxInteract.stroke();
          ctxInteract.beginPath();
          ctxInteract.arc(p.hIn.x * cell, p.hIn.y * cell, Math.max(2.5, cell * 0.1), 0, Math.PI * 2);
          ctxInteract.fillStyle = "#ffe600";
          ctxInteract.fill();
        }
        if (p.hOut) {
          ctxInteract.beginPath();
          ctxInteract.moveTo(p.x * cell, p.y * cell);
          ctxInteract.lineTo(p.hOut.x * cell, p.hOut.y * cell);
          ctxInteract.strokeStyle = "rgba(255, 230, 0, 0.85)";
          ctxInteract.lineWidth = 1.2;
          ctxInteract.stroke();
          ctxInteract.beginPath();
          ctxInteract.arc(p.hOut.x * cell, p.hOut.y * cell, Math.max(2.5, cell * 0.1), 0, Math.PI * 2);
          ctxInteract.fillStyle = "#ffe600";
          ctxInteract.fill();
        }
        const isCloseTarget = i === 0 && closeHover;
        const r = isCloseTarget ? Math.max(6, cell * 0.32) : (i === 0 ? Math.max(4, cell * 0.22) : Math.max(3, cell * 0.16));
        ctxInteract.beginPath();
        ctxInteract.arc(p.x * cell, p.y * cell, r, 0, Math.PI * 2);
        ctxInteract.fillStyle = isCloseTarget ? "#00ff88" : (i === 0 ? "#ffe600" : "#ff6b9d");
        ctxInteract.fill();
        ctxInteract.strokeStyle = isCloseTarget ? "#181825" : "#fff";
        ctxInteract.lineWidth = isCloseTarget ? 2 : 1;
        ctxInteract.stroke();
      });
      ctxInteract.restore();
    }

    if (isMouseDown && (editSelectTool === "ellipse" || editSelectTool === "circle") && dragStartCell && hoveredCell) {
      const { cx, cy, rx, ry } = ovalBounds(
        dragStartCell.col, dragStartCell.row, hoveredCell.col, hoveredCell.row,
        editSelectTool === "circle"
      );
      ctxInteract.save();
      ctxInteract.beginPath();
      ctxInteract.ellipse(cx * cell, cy * cell, Math.max(rx * cell, 1), Math.max(ry * cell, 1), 0, 0, Math.PI * 2);
      ctxInteract.strokeStyle = "#ff6b9d";
      ctxInteract.lineWidth = Math.max(2, Math.floor(cell * 0.1));
      ctxInteract.setLineDash([6, 4]);
      ctxInteract.stroke();
      ctxInteract.restore();
    }

    if (hoveredCell && hoveredCell.col < currentCols && hoveredCell.row < currentRows) {
      if (editPaintTool === "pencil" || editPaintTool === "eraser") {
        const size = Math.max(1, editBrushSize | 0);
        const half = Math.floor((size - 1) / 2);
        const x0 = hoveredCell.col - half;
        const y0 = hoveredCell.row - half;
        const posX = Math.round(x0 * cell);
        const posY = Math.round(y0 * cell);
        const posX2 = Math.round((x0 + size) * cell);
        const posY2 = Math.round((y0 + size) * cell);
        ctxInteract.fillStyle = editPaintTool === "eraser" ? "rgba(255, 77, 94, 0.22)" : "rgba(255, 230, 0, 0.22)";
        ctxInteract.fillRect(posX, posY, posX2 - posX, posY2 - posY);
        ctxInteract.strokeStyle = editPaintTool === "eraser" ? "#ff4d5e" : "#ffe600";
        ctxInteract.lineWidth = 2;
        ctxInteract.setLineDash([4, 3]);
        ctxInteract.strokeRect(posX + 1, posY + 1, posX2 - posX - 2, posY2 - posY - 2);
        ctxInteract.setLineDash([]);
      } else if (!(isAnchorSelectTool() && editPolyPoints.length)) {
        const hX = Math.round(hoveredCell.col * cell), hY = Math.round(hoveredCell.row * cell);
        const hW = Math.round((hoveredCell.col + 1) * cell) - hX, hH = Math.round((hoveredCell.row + 1) * cell) - hY;
        ctxInteract.fillStyle = isPipetteMode ? "rgba(0, 136, 255, 0.28)" : "rgba(255, 230, 0, 0.28)";
        ctxInteract.fillRect(hX, 0, hW, totalH);
        ctxInteract.fillRect(0, hY, totalW, hH);
        ctxInteract.fillStyle = isPipetteMode ? "rgba(0, 136, 255, 0.55)" : "rgba(255, 230, 0, 0.55)";
        ctxInteract.fillRect(hX, hY, hW, hH);
        ctxInteract.strokeStyle = isPipetteMode ? "#0088ff" : "#ffe600";
        ctxInteract.lineWidth = Math.max(2, Math.floor(cell * 0.12));
        ctxInteract.strokeRect(hX + 1, hY + 1, hW - 2, hH - 2);
      }
    }
  }

  function renderHeaders() {
    if (currentCols === 0) return;
    const viewW = Math.max(1, topHeaderWrapper.clientWidth || mainScroll.clientWidth);
    const viewH = Math.max(1, leftHeaderWrapper.clientHeight || mainScroll.clientHeight);
    const dpr = window.devicePixelRatio || 1;
    const { displayW, displayH } = patternDisplaySize();
    const cellW = displayW / currentCols;
    const cellH = currentRows > 0 ? displayH / currentRows : cellW;
    const showRulerNums = canvasZoom >= AXIS_RULER_MIN_ZOOM;
    const fontPx = Math.max(10, Math.min(13, Math.round(Math.min(cellW, cellH, 28) * 0.42) || 11));
    const scrollX = mainScroll.scrollLeft;
    const scrollY = mainScroll.scrollTop;

    const topBufW = Math.max(1, Math.round(viewW * dpr));
    const topBufH = Math.max(1, Math.round(headerBarSize * dpr));
    if (topHeaderCanvas.width !== topBufW || topHeaderCanvas.height !== topBufH) {
      topHeaderCanvas.width = topBufW;
      topHeaderCanvas.height = topBufH;
    }
    topHeaderCanvas.style.width = `${viewW}px`;
    topHeaderCanvas.style.height = `${headerBarSize}px`;
    ctxTop.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctxTop.imageSmoothingEnabled = false;
    ctxTop.fillStyle = "#1e1e2e";
    ctxTop.fillRect(0, 0, viewW, headerBarSize);
    ctxTop.font = `bold ${fontPx}px 'Silkscreen', monospace`;
    ctxTop.textAlign = "center";
    ctxTop.textBaseline = "middle";

    for (let x = 0; x < currentCols; x++) {
      const sX = Math.round(x * cellW - scrollX);
      const sW = Math.round((x + 1) * cellW - scrollX) - sX;
      if (sX + sW < 0 || sX > viewW) continue;
      const isHoveredX = hoveredCell !== null && hoveredCell.col === x;
      ctxTop.fillStyle = isHoveredX ? "#ffe600" : ((x % 5 === 4 || x === currentCols - 1) ? "#242538" : "#1e1e2e");
      ctxTop.fillRect(sX, 0, sW, headerBarSize);
      ctxTop.strokeStyle = isHoveredX ? "#ffffff" : "#45475a";
      ctxTop.lineWidth = isHoveredX ? 2 : 1;
      ctxTop.strokeRect(sX + (isHoveredX ? 1 : 0.5), isHoveredX ? 1 : 0.5, sW - (isHoveredX ? 2 : 1), headerBarSize - (isHoveredX ? 2 : 1));
      if (showRulerNums && !isHoveredX) {
        ctxTop.fillStyle = "#a6adc8";
        ctxTop.fillText((x + 1).toString(), Math.round(sX + sW / 2), Math.round(headerBarSize / 2));
      }
    }

    const leftBufW = Math.max(1, Math.round(headerBarSize * dpr));
    const leftBufH = Math.max(1, Math.round(viewH * dpr));
    if (leftHeaderCanvas.width !== leftBufW || leftHeaderCanvas.height !== leftBufH) {
      leftHeaderCanvas.width = leftBufW;
      leftHeaderCanvas.height = leftBufH;
    }
    leftHeaderCanvas.style.width = `${headerBarSize}px`;
    leftHeaderCanvas.style.height = `${viewH}px`;
    ctxLeft.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctxLeft.imageSmoothingEnabled = false;
    ctxLeft.fillStyle = "#1e1e2e";
    ctxLeft.fillRect(0, 0, headerBarSize, viewH);
    ctxLeft.font = `bold ${fontPx}px 'Silkscreen', monospace`;
    ctxLeft.textAlign = "center";
    ctxLeft.textBaseline = "middle";

    for (let y = 0; y < currentRows; y++) {
      const sY = Math.round(y * cellH - scrollY);
      const sH = Math.round((y + 1) * cellH - scrollY) - sY;
      if (sY + sH < 0 || sY > viewH) continue;
      const isHoveredY = hoveredCell !== null && hoveredCell.row === y;
      ctxLeft.fillStyle = isHoveredY ? "#ffe600" : ((y % 5 === 4 || y === currentRows - 1) ? "#242538" : "#1e1e2e");
      ctxLeft.fillRect(0, sY, headerBarSize, sH);
      ctxLeft.strokeStyle = isHoveredY ? "#ffffff" : "#45475a";
      ctxLeft.lineWidth = isHoveredY ? 2 : 1;
      ctxLeft.strokeRect(isHoveredY ? 1 : 0.5, sY + (isHoveredY ? 1 : 0.5), headerBarSize - (isHoveredY ? 2 : 1), sH - (isHoveredY ? 2 : 1));
      if (showRulerNums && !isHoveredY) {
        ctxLeft.fillStyle = "#a6adc8";
        ctxLeft.fillText((y + 1).toString(), Math.round(headerBarSize / 2), Math.round(sY + sH / 2));
      }
    }
    updateAxisHoverBadges();
  }

  let headerRenderRaf = 0;
  function scheduleHeaderRender() {
    if (headerRenderRaf) return;
    headerRenderRaf = requestAnimationFrame(() => {
      headerRenderRaf = 0;
      renderHeaders();
    });
  }
  if (typeof ResizeObserver !== "undefined") {
    const headerResizeObserver = new ResizeObserver(() => scheduleHeaderRender());
    headerResizeObserver.observe(topHeaderWrapper);
    headerResizeObserver.observe(leftHeaderWrapper);
  }

  function updateAxisHoverBadges() {
    const colBadge = document.getElementById("hoverColBadge");
    const rowBadge = document.getElementById("hoverRowBadge");
    if (!colBadge || !rowBadge) return;
    if (!hoveredCell || currentCols === 0 || currentRows === 0) {
      colBadge.classList.remove("is-visible");
      rowBadge.classList.remove("is-visible");
      return;
    }
    const headerSize = headerBarSize;
    const { displayW, displayH } = patternDisplaySize();
    const cellW = displayW / currentCols;
    const cellH = displayH / currentRows;
    const viewW = mainScroll.clientWidth;
    const viewH = mainScroll.clientHeight;
    const xCenter = headerSize + hoveredCell.col * cellW + cellW / 2 - mainScroll.scrollLeft;
    const yCenter = headerSize + hoveredCell.row * cellH + cellH / 2 - mainScroll.scrollTop;
    const colVisible = xCenter > headerSize - 12 && xCenter < headerSize + viewW + 12;
    const rowVisible = yCenter > headerSize - 12 && yCenter < headerSize + viewH + 12;

    colBadge.textContent = String(hoveredCell.col + 1);
    colBadge.classList.toggle("is-visible", colVisible);
    if (colVisible) {
      const bw = Math.max(colBadge.offsetWidth, 32), bh = Math.max(colBadge.offsetHeight, 30);
      const cx = Math.max(headerSize + bw / 2, Math.min(headerSize + viewW - bw / 2, xCenter));
      colBadge.style.left = `${Math.round(cx - bw / 2)}px`;
      colBadge.style.top = `${Math.round((headerSize - bh) / 2)}px`;
    }

    rowBadge.textContent = String(hoveredCell.row + 1);
    rowBadge.classList.toggle("is-visible", rowVisible);
    if (rowVisible) {
      const bw = Math.max(rowBadge.offsetWidth, 32), bh = Math.max(rowBadge.offsetHeight, 30);
      const cy = Math.max(headerSize + bh / 2, Math.min(headerSize + viewH - bh / 2, yCenter));
      rowBadge.style.left = `${Math.round((headerSize - bw) / 2)}px`;
      rowBadge.style.top = `${Math.round(cy - bh / 2)}px`;
    }
  }

  function renderCompareCanvas() {
    if (!isCompareMode || !currentImage || currentCols === 0) return;
    ctxCompare.fillStyle = "#181825";
    ctxCompare.fillRect(0, 0, compareCanvas.width, compareCanvas.height);
    ctxCompare.imageSmoothingQuality = "high";
    ctxCompare.drawImage(currentImage, 0, 0, compareCanvas.width, compareCanvas.height);
  }

  function toggleCompareMode() {
    isCompareMode = !isCompareMode;
    document.getElementById("compareBtn").classList.toggle("active-compare", isCompareMode);
    document.getElementById("compareWrapper").classList.toggle("show", isCompareMode);
    if(isCompareMode) renderCompareCanvas();
  }

  function setEditMode() {
    isEditMode = true;
  }
  function toggleEditMode() {
    isEditMode = true;
  }

  function togglePipetteMode() { setPipetteMode(!isPipetteMode); }
  function setPipetteMode(active) {
    isPipetteMode = active;
    document.getElementById("pipetteBtn").classList.toggle("active-pipette", isPipetteMode);
    document.getElementById("pipetteBtn").classList.toggle("highlight", isPipetteMode);
    document.getElementById("mainCanvasInner").classList.toggle("pipette-mode", isPipetteMode);
    if (active && editPaintTool !== "none") setPaintTool("none", { force: true });
    if (active && !isEditMode) setEditMode(true);
    renderInteractionLayer();
    updateSelectCount();
  }

  function cloneToolIcon(btnId) {
    const src = document.getElementById(btnId);
    const svg = src && src.querySelector(".tool-icon");
    if (!svg) return null;
    return svg.cloneNode(true);
  }

  function setToggleCaption(el, text, iconBtnId) {
    if (!el) return;
    el.replaceChildren();
    el.append(document.createTextNode(text));
    const icon = iconBtnId ? cloneToolIcon(iconBtnId) : null;
    if (icon) el.appendChild(icon);
  }

  function currentSelectToolIconId() {
    if (isPipetteMode) return "pipetteBtn";
    if (editSelectTool === "rect") return "editRectSelectBtn";
    if (editSelectTool === "circle") return "editCircleSelectBtn";
    if (editSelectTool === "ellipse") return "editEllipseSelectBtn";
    if (editSelectTool === "poly") return "editPolySelectBtn";
    if (editSelectTool === "movecopy") return "editMoveCopySelectBtn";
    return "";
  }

  function updateSelectCount() {
    const selectToggle = document.getElementById("patternSizeToggle");
    if (selectToggle) {
      const caption = selectedCells.size > 0 ? "取消選取" : "選取工具";
      setToggleCaption(selectToggle, caption, currentSelectToolIconId());
    }
    const editToggle = document.getElementById("editToolsToggle");
    if (editToggle) {
      if (editPaintTool === "pencil") setToggleCaption(editToggle, "編輯工具", "editPencilBtn");
      else if (editPaintTool === "eraser") setToggleCaption(editToggle, "編輯工具", "editEraserBtn");
      else setToggleCaption(editToggle, "編輯工具", "");
    }
    if (!isHistoryNavigating && historyIndex >= 0 && historyStack[historyIndex]) {
      historyStack[historyIndex].selection = Array.from(selectedCells);
    }
  }
  function clearSelection() {
    selectedCells.clear();
    resetEditPoly();
    isMovingSelection = false;
    isMovingMarquee = false;
    moveOffset = { dx: 0, dy: 0 };
    updateSelectCount();
    renderInteractionLayer();
  }
  const patternSizeToggleBtn = document.getElementById("patternSizeToggle");
  if (patternSizeToggleBtn) {
    patternSizeToggleBtn.addEventListener("click", () => {
      if (!isEditMode) { setEditMode(true); return; }
      if (!selectedCells.size) return;
      clearSelection();
    });
  }
  const editToolsToggleBtn = document.getElementById("editToolsToggle");
  if (editToolsToggleBtn) {
    editToolsToggleBtn.addEventListener("click", () => {
      if (!isEditMode) setEditMode(true);
    });
  }
  function selectAllBeads() {
    for (let y = 0; y < currentRows; y++) for (let x = 0; x < currentCols; x++) selectedCells.add(`${x},${y}`);
    updateSelectCount(); renderInteractionLayer();
  }

  function applyReplaceColor() {
    if (selectedCells.size === 0) { alert("請先在圖紙上選取拼豆！"); return false; }
    selectedCells.forEach(key => {
      const [x, y] = key.split(",").map(Number);
      patternGridData[y][x] = currentSelectedBead;
    });
    pushHistoryState("填色");
    recalculateStats();
    renderBasePattern();
    renderInteractionLayer();
    return true;
  }

  function copySelection() {
    if (selectedCells.size === 0) { alert("請先在圖紙上選取拼豆！"); return; }
    const b = getVisibleSelectionBounds();
    if (!b) { alert("請先在圖紙上選取拼豆！"); return; }
    const cells = [];
    selectedCells.forEach(key => {
      const [x, y] = key.split(",").map(Number);
      cells.push({ dx: x - b.minX, dy: y - b.minY, bead: patternGridData[y][x] });
    });
    editClipboard = { w: b.maxX - b.minX + 1, h: b.maxY - b.minY + 1, cells, originX: b.minX, originY: b.minY };
  }

  function pasteOriginCell() {
    if (hoveredCell && hoveredCell.col >= 0 && hoveredCell.row >= 0) {
      return { x: hoveredCell.col, y: hoveredCell.row };
    }
    if (selectedCells.size) {
      const b = getVisibleSelectionBounds();
      if (b) return { x: b.minX, y: b.minY };
    }
    const { displayW, displayH } = patternDisplaySize();
    const cellW = currentCols > 0 ? displayW / currentCols : 1;
    const cellH = currentRows > 0 ? displayH / currentRows : 1;
    const ox = Math.max(0, Math.min(currentCols - 1, Math.floor(mainScroll.scrollLeft / cellW)));
    const oy = Math.max(0, Math.min(currentRows - 1, Math.floor(mainScroll.scrollTop / cellH)));
    return { x: ox, y: oy };
  }

  function pasteSelection() {
    if (!editClipboard || !editClipboard.cells.length) { alert("請先複製選取範圍！"); return; }
    let { x: ox, y: oy } = pasteOriginCell();
    if (ox === editClipboard.originX && oy === editClipboard.originY) {
      ox = Math.min(currentCols - 1, ox + 1);
      oy = Math.min(currentRows - 1, oy + 1);
    }
    const next = new Set();
    editClipboard.cells.forEach(({ dx, dy, bead }) => {
      const x = ox + dx, y = oy + dy;
      if (x < 0 || y < 0 || x >= currentCols || y >= currentRows) return;
      patternGridData[y][x] = bead;
      next.add(`${x},${y}`);
    });
    if (!next.size) { alert("貼上位置超出圖紙範圍！"); return; }
    selectedCells = next;
    pushHistoryState("貼上");
    updateSelectCount();
    recalculateStats();
    renderBasePattern();
    renderInteractionLayer();
  }

  function mirrorSelection(axis) {
    if (selectedCells.size === 0) { alert("請先在圖紙上選取拼豆！"); return; }
    const b = getVisibleSelectionBounds();
    if (!b) { alert("請先在圖紙上選取拼豆！"); return; }
    const items = [];
    selectedCells.forEach(key => {
      const [x, y] = key.split(",").map(Number);
      items.push({ x, y, bead: patternGridData[y][x] });
    });
    items.forEach(({ x, y }) => { patternGridData[y][x] = null; });
    const next = new Set();
    items.forEach(({ x, y, bead }) => {
      const nx = axis === "h" ? b.minX + b.maxX - x : x;
      const ny = axis === "v" ? b.minY + b.maxY - y : y;
      if (nx < 0 || ny < 0 || nx >= currentCols || ny >= currentRows) return;
      patternGridData[ny][nx] = bead;
      next.add(`${nx},${ny}`);
    });
    selectedCells = next;
    pushHistoryState(axis === "v" ? "垂直鏡像" : "水平鏡像");
    updateSelectCount();
    recalculateStats();
    renderBasePattern();
    renderInteractionLayer();
  }

  function hasMultiCellSelection() {
    const b = getVisibleSelectionBounds();
    return !!(b && (b.minX !== b.maxX || b.minY !== b.maxY));
  }

  function canScaleSelection() {
    return isEditMode && hasMultiCellSelection() && editPaintTool === "none" && !isPipetteMode && !(isAnchorSelectTool() && editPolyPoints.length);
  }

  function canMoveMarquee() {
    return isEditMode && selectedCells.size > 0 && editPaintTool === "none" && !isPipetteMode && !(isAnchorSelectTool() && editPolyPoints.length);
  }

  function selectionMoveHandlePoint(bounds, cell) {
    const x0 = bounds.minX * cell, y0 = bounds.minY * cell;
    const x1 = (bounds.maxX + 1) * cell, y1 = (bounds.maxY + 1) * cell;
    const xm = (x0 + x1) / 2;
    const gap = Math.max(18, cell * 0.7);
    let x = xm, y = y0 - gap;
    if (y < gap * 0.45) y = y1 + gap;
    return { id: "marquee", x, y, cursor: "move" };
  }

  function drawMarqueeMoveHandle(ctx, bounds, cell) {
    const h = selectionMoveHandlePoint(bounds, cell);
    const r = Math.max(10, Math.min(16, cell * 0.42), selectionHandleDrawSize(cell) * 1.7);
    ctx.save();
    ctx.fillStyle = "#ffffff";
    ctx.strokeStyle = "#0088ff";
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(h.x, h.y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();
    ctx.strokeStyle = "#0088ff";
    ctx.fillStyle = "#0088ff";
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = Math.max(1.5, r * 0.16);
    const a = r * 0.52;
    ctx.beginPath();
    ctx.moveTo(h.x, h.y - a);
    ctx.lineTo(h.x, h.y + a);
    ctx.moveTo(h.x - a, h.y);
    ctx.lineTo(h.x + a, h.y);
    ctx.stroke();
    const t = r * 0.26;
    const tips = [
      [h.x, h.y - a, h.x - t * 0.75, h.y - a + t, h.x + t * 0.75, h.y - a + t],
      [h.x, h.y + a, h.x - t * 0.75, h.y + a - t, h.x + t * 0.75, h.y + a - t],
      [h.x - a, h.y, h.x - a + t, h.y - t * 0.75, h.x - a + t, h.y + t * 0.75],
      [h.x + a, h.y, h.x + a - t, h.y - t * 0.75, h.x + a - t, h.y + t * 0.75]
    ];
    tips.forEach((p) => {
      ctx.beginPath();
      ctx.moveTo(p[0], p[1]);
      ctx.lineTo(p[2], p[3]);
      ctx.lineTo(p[4], p[5]);
      ctx.closePath();
      ctx.fill();
    });
    ctx.restore();
  }

  function hitTestMarqueeHandle(e) {
    if (!canMoveMarquee() || isMovingSelection) return null;
    const bounds = getVisibleSelectionBounds();
    if (!bounds) return null;
    const rect = interactionCanvas.getBoundingClientRect();
    let clientX = e.clientX, clientY = e.clientY;
    if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    const cssX = clientX - rect.left, cssY = clientY - rect.top;
    const cellCss = rect.width > 0 ? rect.width / currentCols : 1;
    const h = selectionMoveHandlePoint(bounds, cellCss);
    const hitR = Math.max(16, cellCss * 0.55);
    if (Math.hypot(cssX - h.x, cssY - h.y) <= hitR) return h;
    return null;
  }

  function applyMarqueeMove(dx, dy) {
    if (!dx && !dy) return;
    const next = new Set();
    selectedCells.forEach((key) => {
      const [x, y] = key.split(",").map(Number);
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= currentCols || ny >= currentRows) return;
      next.add(`${nx},${ny}`);
    });
    if (!next.size) return;
    selectedCells = next;
    updateSelectCount();
    renderInteractionLayer();
  }

  function selectionHandleDrawSize(cell) {
    const rect = interactionCanvas.getBoundingClientRect();
    const cssToCanvas = rect.width > 0 ? interactionCanvas.width / rect.width : 1;
    return Math.max(5, 6 * cssToCanvas, cell * 0.22);
  }

  function selectionHandlePoints(bounds, cell) {
    const x0 = bounds.minX * cell, y0 = bounds.minY * cell;
    const x1 = (bounds.maxX + 1) * cell, y1 = (bounds.maxY + 1) * cell;
    const xm = (x0 + x1) / 2, ym = (y0 + y1) / 2;
    return [
      { id: "nw", x: x0, y: y0, cursor: "nwse-resize" },
      { id: "n", x: xm, y: y0, cursor: "ns-resize" },
      { id: "ne", x: x1, y: y0, cursor: "nesw-resize" },
      { id: "e", x: x1, y: ym, cursor: "ew-resize" },
      { id: "se", x: x1, y: y1, cursor: "nwse-resize" },
      { id: "s", x: xm, y: y1, cursor: "ns-resize" },
      { id: "sw", x: x0, y: y1, cursor: "nesw-resize" },
      { id: "w", x: x0, y: ym, cursor: "ew-resize" }
    ];
  }

  function hitTestSelectionHandle(e) {
    if (!canScaleSelection()) return null;
    const bounds = getVisibleSelectionBounds();
    if (!bounds) return null;
    const rect = interactionCanvas.getBoundingClientRect();
    let clientX = e.clientX, clientY = e.clientY;
    if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    const cssX = clientX - rect.left, cssY = clientY - rect.top;
    const cellCss = rect.width > 0 ? rect.width / currentCols : 1;
    const hitR = Math.max(12, cellCss * 0.45);
    const handles = selectionHandlePoints(bounds, cellCss);
    for (let i = 0; i < handles.length; i++) {
      if (Math.abs(cssX - handles[i].x) <= hitR && Math.abs(cssY - handles[i].y) <= hitR) return handles[i];
    }
    return null;
  }

  function boundsFromScaleHandle(id, col, row, start) {
    let minX = start.minX, minY = start.minY, maxX = start.maxX, maxY = start.maxY;
    col = Math.max(0, Math.min(currentCols - 1, col));
    row = Math.max(0, Math.min(currentRows - 1, row));
    if (id.indexOf("w") !== -1) minX = col;
    if (id.indexOf("e") !== -1) maxX = col;
    if (id.indexOf("n") !== -1) minY = row;
    if (id.indexOf("s") !== -1) maxY = row;
    if (minX > maxX) { const t = minX; minX = maxX; maxX = t; }
    if (minY > maxY) { const t = minY; minY = maxY; maxY = t; }
    return { minX, minY, maxX, maxY, filled: start.filled };
  }

  function applySelectionScale(dest) {
    const srcBox = getVisibleSelectionBounds();
    if (!srcBox || !dest) return;
    if (srcBox.minX === dest.minX && srcBox.minY === dest.minY && srcBox.maxX === dest.maxX && srcBox.maxY === dest.maxY) return;
    const srcW = srcBox.maxX - srcBox.minX + 1;
    const srcH = srcBox.maxY - srcBox.minY + 1;
    const dstW = dest.maxX - dest.minX + 1;
    const dstH = dest.maxY - dest.minY + 1;
    if (dstW < 1 || dstH < 1) return;
    const src = Array.from({ length: srcH }, () => Array(srcW).fill(undefined));
    selectedCells.forEach(key => {
      const [x, y] = key.split(",").map(Number);
      const lx = x - srcBox.minX, ly = y - srcBox.minY;
      if (lx < 0 || ly < 0 || lx >= srcW || ly >= srcH) return;
      src[ly][lx] = patternGridData[y][x];
    });
    selectedCells.forEach(key => {
      const [x, y] = key.split(",").map(Number);
      patternGridData[y][x] = null;
    });
    const next = new Set();
    for (let dy = 0; dy < dstH; dy++) {
      for (let dx = 0; dx < dstW; dx++) {
        const sx = Math.min(srcW - 1, Math.floor(dx * srcW / dstW));
        const sy = Math.min(srcH - 1, Math.floor(dy * srcH / dstH));
        if (src[sy][sx] === undefined) continue;
        const x = dest.minX + dx, y = dest.minY + dy;
        if (x < 0 || y < 0 || x >= currentCols || y >= currentRows) continue;
        patternGridData[y][x] = src[sy][sx];
        next.add(`${x},${y}`);
      }
    }
    selectedCells = next;
    pushHistoryState("縮放選取");
    updateSelectCount();
    recalculateStats();
    renderBasePattern();
    renderInteractionLayer();
  }

  function forEachBrushCell(col, row, fn) {
    const size = Math.max(1, editBrushSize | 0);
    const half = Math.floor((size - 1) / 2);
    for (let dy = 0; dy < size; dy++) {
      for (let dx = 0; dx < size; dx++) {
        const x = col + dx - half;
        const y = row + dy - half;
        if (x < 0 || y < 0 || x >= currentCols || y >= currentRows) continue;
        fn(x, y);
      }
    }
  }

  function paintBrushAt(col, row) {
    forEachBrushCell(col, row, (x, y) => {
      patternGridData[y][x] = editPaintTool === "eraser" ? null : currentSelectedBead;
    });
    paintStrokeDirty = true;
    renderBasePattern();
    renderInteractionLayer();
  }

  function updatePaintToolUi() {
    const pencilBtn = document.getElementById("editPencilBtn");
    const eraserBtn = document.getElementById("editEraserBtn");
    if (pencilBtn) pencilBtn.classList.toggle("highlight", editPaintTool === "pencil");
    if (eraserBtn) eraserBtn.classList.toggle("highlight", editPaintTool === "eraser");
    const inner = document.getElementById("mainCanvasInner");
    if (inner) {
      inner.classList.toggle("paint-pencil-mode", editPaintTool === "pencil");
      inner.classList.toggle("paint-eraser-mode", editPaintTool === "eraser");
    }
  }

  function setPaintTool(tool, opts) {
    const force = opts && opts.force;
    if (!force && editPaintTool === tool) tool = "none";
    editPaintTool = tool;
    isPainting = false;
    if (editPaintTool !== "none") {
      if (editSelectTool !== "none") setEditSelectTool("none", { force: true });
      setPipetteMode(false);
      if (!isEditMode) setEditMode(true);
    }
    updatePaintToolUi();
    renderInteractionLayer();
    updateSelectCount();
  }

  function applyDeleteBeads() {
    if (selectedCells.size === 0) { alert("請先在圖紙上選取拼豆！"); return; }
    selectedCells.forEach(key => {
      const [x, y] = key.split(",").map(Number);
      patternGridData[y][x] = null;
    });
    pushHistoryState("刪除拼豆");
    clearSelection();
    recalculateStats();
    renderBasePattern();
  }

  function getCanvasCoordsFromEvent(e) {
    const rect = interactionCanvas.getBoundingClientRect();
    let clientX = e.clientX, clientY = e.clientY;
    if (e.touches && e.touches.length > 0) { clientX = e.touches[0].clientX; clientY = e.touches[0].clientY; }
    const fx = rect.width > 0 ? (clientX - rect.left) / rect.width * currentCols : 0;
    const fy = rect.height > 0 ? (clientY - rect.top) / rect.height * currentRows : 0;
    const col = Math.floor(fx);
    const row = Math.floor(fy);
    return { col, row, fx, fy, clientX, clientY };
  }

  function isAnchorSelectTool() {
    return editSelectTool === "poly";
  }

  function isMoveSelectTool() {
    return editSelectTool === "movecopy";
  }

  function setEditSelectTool(tool, opts) {
    const force = opts && opts.force;
    if (!force && editSelectTool === tool) tool = "none";
    editSelectTool = tool;
    if (!isAnchorSelectTool()) resetEditPoly();
    if (!isMoveSelectTool()) {
      isMovingSelection = false;
      moveOffset = { dx: 0, dy: 0 };
    }
    isMovingMarquee = false;
    if (editSelectTool !== "none") {
      setPipetteMode(false);
      if (editPaintTool !== "none") setPaintTool("none", { force: true });
      if (!isEditMode) setEditMode(true);
    }
    const rectBtn = document.getElementById("editRectSelectBtn");
    const circleBtn = document.getElementById("editCircleSelectBtn");
    const ellipseBtn = document.getElementById("editEllipseSelectBtn");
    const polyBtn = document.getElementById("editPolySelectBtn");
    const moveCopyBtn = document.getElementById("editMoveCopySelectBtn");
    if (rectBtn) rectBtn.classList.toggle("highlight", editSelectTool === "rect");
    if (circleBtn) circleBtn.classList.toggle("highlight", editSelectTool === "circle");
    if (ellipseBtn) ellipseBtn.classList.toggle("highlight", editSelectTool === "ellipse");
    if (polyBtn) polyBtn.classList.toggle("highlight", editSelectTool === "poly");
    if (moveCopyBtn) moveCopyBtn.classList.toggle("highlight", editSelectTool === "movecopy");
    const inner = document.getElementById("mainCanvasInner");
    if (inner) {
      inner.classList.toggle("select-move-mode", isMoveSelectTool());
      inner.classList.remove("is-grabbing");
    }
    renderInteractionLayer();
    updateSelectCount();
  }
  setEditSelectTool("rect", { force: true });

  function pointInPolygon(px, py, points) {
    let inside = false;
    for (let i = 0, j = points.length - 1; i < points.length; j = i++) {
      const xi = points[i].x, yi = points[i].y;
      const xj = points[j].x, yj = points[j].y;
      const hit = ((yi > py) !== (yj > py)) && (px < (xj - xi) * (py - yi) / ((yj - yi) || 1e-12) + xi);
      if (hit) inside = !inside;
    }
    return inside;
  }

  function resetEditPoly() {
    editPolyPoints = [];
    editPolyHover = null;
    isPolyHandleDrag = false;
    polyHandleAnchorIndex = -1;
  }

  function cubicBezierPoint(p0, p1, p2, p3, t) {
    const u = 1 - t, tt = t * t, uu = u * u;
    return {
      x: uu * u * p0.x + 3 * uu * t * p1.x + 3 * u * tt * p2.x + tt * t * p3.x,
      y: uu * u * p0.y + 3 * uu * t * p1.y + 3 * u * tt * p2.y + tt * t * p3.y
    };
  }

  function flattenEditPoly(points, closed) {
    if (!points.length) return [];
    const out = [];
    const n = points.length;
    const segs = closed ? n : n - 1;
    for (let i = 0; i < segs; i++) {
      const a = points[i];
      const b = points[(i + 1) % n];
      if (!a.hOut && !b.hIn) {
        out.push({ x: a.x, y: a.y });
        continue;
      }
      const p1 = a.hOut || a;
      const p2 = b.hIn || b;
      const len = Math.hypot(b.x - a.x, b.y - a.y)

    const expCtx = expCanvas.getContext("2d", { alpha: false });
    expCtx.fillStyle = "#ffffff"; expCtx.fillRect(0, 0, fullW, fullH);

    for (let y = 0; y < currentRows; y++) {
      for (let x = 0; x < currentCols; x++) {

        const pX = headerSize + x * cell, pY = headerSize + y * cell;

            expCtx.textAlign = "center"; expCtx.textBaseline = "middle";
            expCtx.fillText(bead.code, pX + cell / 2, pY + cell / 2);
          }
        }
      }
    }

    expCtx.beginPath();
    for (let x = 0; x <= currentCols; x++) {
      const pX = headerSize + x * cell; expCtx.moveTo(pX, headerSize); expCtx.lineTo(pX, fullH);
    }
    for (let y = 0; y <= currentRows; y++) {
      const pY = headerSize + y * cell; expCtx.moveTo(headerSize, pY); expCtx.lineTo(fullW, pY);
    }
    expCtx.strokeStyle = "rgba(0,0,0,0.12)"; expCtx.lineWidth = 0.8; expCtx.stroke();
    
    if (gridGuideVisible) {
      const stepX = readGridGuideStep("gridGuideX");
      const stepY = readGridGuideStep("gridGuideY");
      expCtx.beginPath();
      for (let x = stepX; x < currentCols; x += stepX) {
        const pX = headerSize + x * cell; expCtx.moveTo(pX, headerSize); expCtx.lineTo(pX, fullH);
      }
      expCtx.strokeStyle = "#ff3344"; expCtx.lineWidth = 1.2; expCtx.stroke();

      expCtx.beginPath(); expCtx.setLineDash([4, 3]);
      for (let y = stepY; y < currentRows; y += stepY) {
        const pY = headerSize + y * cell; expCtx.moveTo(headerSize, pY); expCtx.lineTo(fullW, pY);
      }
      expCtx.stroke(); expCtx.setLineDash([]);

    expCtx.fillStyle = "#1e1e2e"; expCtx.fillRect(0, 0, headerSize, headerSize);
    expCtx.strokeStyle = "#45475a"; expCtx.strokeRect(0, 0, headerSize, headerSize);

  function drawDetectedFaces() {
    if (!ctxCrop || !cropOverlay) return;
    if (uploadTool !== "none") return;
    ctxCrop.clearRect(0, 0, cropOverlay.width, cropOverlay.height);
    if (!detectedFaces.length) return;

      ctxCrop.strokeRect(face.x, face.y, face.w, face.h);
      const label = detectedFaces.length > 1 ? `臉 ${i + 1}` : "臉";
      const fontPx = Math.max(11, Math.round(13 * viewScale));
      ctxCrop.font = `900 ${fontPx}px sans-serif`;
      ctxCrop.textBaseline = "bottom";
      const pad = Math.max(3, 4 * viewScale);
      const tw = ctxCrop.measureText(label).width;
      const lx = Math.max(0, face.x);
      const ly = Math.max(fontPx + pad, face.y - 2);
      ctxCrop.fillStyle = "rgba(17, 17, 27, 0.82)";
      ctxCrop.fillRect(lx, ly - fontPx - pad, tw + pad * 2, fontPx + pad);
      ctxCrop.fillStyle = "#ffe600";
      ctxCrop.fillText(label, lx + pad, ly - pad * 0.3);
    });
